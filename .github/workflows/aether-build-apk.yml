name: Build Aether Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Install SDK packages directly; avoid the setup-android action
      # that caused the earlier SDK package installation failure.
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/aether/launcher

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AetherLauncher"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          org.gradle.parallel=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.aether.launcher"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.aether.launcher"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:allowBackup="true"
                  android:label="Aether Launcher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/aether/launcher/MainActivity.kt <<'EOF'
          package com.aether.launcher

          import android.content.Intent
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.detectDragGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Apps
          import androidx.compose.material.icons.filled.Brush
          import androidx.compose.material.icons.filled.Settings
          import androidx.compose.material.icons.filled.Wallpaper
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.IntOffset
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlin.math.roundToInt

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { AetherApp() }
              }
          }

          private val colors = listOf(
              Color(0xFFB7A7FF), Color(0xFF8EDBD0), Color(0xFFFFB6C8),
              Color(0xFFFFD18A), Color(0xFF9CCBFF)
          )

          @Composable
          private fun AetherApp() {
              val context = LocalContext.current
              var page by remember { mutableStateOf("home") }
              var dark by remember { mutableStateOf(true) }
              var colorIndex by remember { mutableIntStateOf(0) }
              var widgetScale by remember { mutableFloatStateOf(1f) }
              var dragX by remember { mutableFloatStateOf(0f) }
              var dragY by remember { mutableFloatStateOf(0f) }
              val accent = colors[colorIndex]
              val bg = if (dark) Color(0xFF101116) else Color(0xFFF2F2F7)
              val panel = if (dark) Color(0xFF20222B) else Color.White
              val fg = if (dark) Color(0xFFF7F4FF) else Color(0xFF171821)
              val muted = if (dark) Color(0xFFB9B6C5) else Color(0xFF656575)

              MaterialTheme(
                  colorScheme = if (dark) darkColorScheme(primary = accent, background = bg, surface = panel)
                                else lightColorScheme(primary = accent, background = bg, surface = panel)
              ) {
                  Box(Modifier.fillMaxSize().background(bg)) {
                      Column(Modifier.fillMaxSize().padding(horizontal = 20.dp, vertical = 18.dp)) {
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                              Column {
                                  Text("AETHER", color = muted, fontSize = 12.sp, fontWeight = FontWeight.Bold, letterSpacing = 3.sp)
                                  Text(
                                      when (page) {
                                          "themes" -> "Темы"
                                          "settings" -> "Настройки"
                                          "apps" -> "Приложения"
                                          else -> "Главный экран"
                                      },
                                      color = fg, fontSize = 25.sp, fontWeight = FontWeight.Bold
                                  )
                              }
                              IconButton(onClick = { page = "settings" }) {
                                  Icon(Icons.Default.Settings, contentDescription = "Настройки", tint = fg)
                              }
                          }

                          Spacer(Modifier.height(20.dp))

                          when (page) {
                              "themes" -> {
                                  Text("Акцентный цвет", color = muted)
                                  Spacer(Modifier.height(14.dp))
                                  Row(horizontalArrangement = Arrangement.spacedBy(14.dp)) {
                                      colors.forEachIndexed { index, color ->
                                          Box(
                                              Modifier.size(44.dp).clip(CircleShape).background(color)
                                                  .clickable { colorIndex = index },
                                              contentAlignment = Alignment.Center
                                          ) {
                                              if (colorIndex == index) Text("✓", color = Color.Black, fontWeight = FontWeight.Bold)
                                          }
                                      }
                                  }
                                  Spacer(Modifier.height(24.dp))
                                  SettingRow("Тёмное оформление", dark, { dark = it }, panel, fg)
                                  Spacer(Modifier.height(10.dp))
                                  Text("Цвет и оформление применяются ко всему интерфейсу лаунчера.", color = muted, fontSize = 12.sp)
                              }
                              "settings" -> {
                                  SettingRow("Тёмное оформление", dark, { dark = it }, panel, fg)
                                  Spacer(Modifier.height(14.dp))
                                  Card(colors = CardDefaults.cardColors(containerColor = panel)) {
                                      Column(Modifier.fillMaxWidth().padding(16.dp)) {
                                          Text("Размер виджета", color = fg, fontWeight = FontWeight.SemiBold)
                                          Slider(value = widgetScale, onValueChange = { widgetScale = it }, valueRange = 0.8f..1.2f)
                                          Text("${(widgetScale * 100).roundToInt()}%", color = muted)
                                      }
                                  }
                                  Spacer(Modifier.height(14.dp))
                                  Button(
                                      onClick = { runCatching { context.startActivity(Intent(Intent.ACTION_SET_WALLPAPER)) } },
                                      modifier = Modifier.fillMaxWidth()
                                  ) {
                                      Icon(Icons.Default.Wallpaper, contentDescription = null)
                                      Spacer(Modifier.width(8.dp))
                                      Text("Выбрать обои")
                                  }
                              }
                              "apps" -> {
                                  val apps = remember {
                                      context.packageManager.queryIntentActivities(
                                          Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0
                                      ).sortedBy { it.loadLabel(context.packageManager).toString().lowercase() }
                                  }
                                  LazyColumn(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                                      items(apps) { info ->
                                          val label = info.loadLabel(context.packageManager).toString()
                                          Card(
                                              modifier = Modifier.fillMaxWidth().clickable {
                                                  context.packageManager.getLaunchIntentForPackage(info.activityInfo.packageName)?.let(context::startActivity)
                                              },
                                              colors = CardDefaults.cardColors(containerColor = panel)
                                          ) {
                                              Row(Modifier.padding(14.dp), verticalAlignment = Alignment.CenterVertically) {
                                                  Text(label, color = fg, modifier = Modifier.weight(1f))
                                                  Text("Открыть  ›", color = accent, fontSize = 12.sp)
                                              }
                                          }
                                      }
                                  }
                              }
                              else -> {
                                  Box(Modifier.fillMaxWidth().height(205.dp), contentAlignment = Alignment.Center) {
                                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                          Text("01:38", color = fg, fontSize = 58.sp, fontWeight = FontWeight.Light)
                                          Text("Aether · главный экран", color = muted, fontSize = 14.sp)
                                      }
                                  }
                                  Card(
                                      modifier = Modifier
                                          .offset { IntOffset(dragX.roundToInt(), dragY.roundToInt()) }
                                          .fillMaxWidth()
                                          .pointerInput(Unit) {
                                              detectDragGestures { change, amount ->
                                                  change.consume()
                                                  dragX += amount.x
                                                  dragY += amount.y
                                              }
                                          },
                                      shape = RoundedCornerShape(26.dp),
                                      colors = CardDefaults.cardColors(containerColor = panel)
                                  ) {
                                      Column(Modifier.padding(18.dp)) {
                                          Text("ПОГОДА · ВИДЖЕТ", color = muted, fontSize = 11.sp, fontWeight = FontWeight.Bold, letterSpacing = 1.sp)
                                          Spacer(Modifier.height(8.dp))
                                          Row(verticalAlignment = Alignment.CenterVertically) {
                                              Text("☀  24°", color = fg, fontSize = 34.sp, fontWeight = FontWeight.Light)
                                              Spacer(Modifier.weight(1f))
                                              Text("Хороший день", color = muted, fontSize = 12.sp)
                                          }
                                      }
                                  }
                                  Spacer(Modifier.height(10.dp))
                                  Text("Перетаскивай карточку, чтобы менять её положение.", color = muted, fontSize = 11.sp)
                                  Spacer(Modifier.height(16.dp))
                                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                      HomeTile("Темы", Icons.Default.Brush, accent, panel, fg, Modifier.weight(1f)) { page = "themes" }
                                      HomeTile("Приложения", Icons.Default.Apps, accent, panel, fg, Modifier.weight(1f)) { page = "apps" }
                                      HomeTile("Обои", Icons.Default.Wallpaper, accent, panel, fg, Modifier.weight(1f)) {
                                          runCatching { context.startActivity(Intent(Intent.ACTION_SET_WALLPAPER)) }
                                      }
                                  }
                              }
                          }

                          Spacer(Modifier.weight(1f))
                          if (page != "home") {
                              TextButton(onClick = { page = "home" }, modifier = Modifier.align(Alignment.CenterHorizontally)) {
                                  Text("На главный экран")
                              }
                          } else {
                              Row(
                                  Modifier.fillMaxWidth().clip(RoundedCornerShape(24.dp)).background(panel).padding(4.dp),
                                  horizontalArrangement = Arrangement.SpaceEvenly
                              ) {
                                  NavButton("Домой", fg) { page = "home" }
                                  NavButton("Темы", fg) { page = "themes" }
                                  NavButton("Приложения", fg) { page = "apps" }
                                  NavButton("Настройки", fg) { page = "settings" }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun SettingRow(title: String, checked: Boolean, onChecked: (Boolean) -> Unit, panel: Color, fg: Color) {
              Card(colors = CardDefaults.cardColors(containerColor = panel)) {
                  Row(
                      Modifier.fillMaxWidth().padding(start = 16.dp, end = 8.dp, top = 8.dp, bottom = 8.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Text(title, color = fg, modifier = Modifier.weight(1f))
                      Switch(checked = checked, onCheckedChange = onChecked)
                  }
              }
          }

          @Composable
          private fun HomeTile(
              title: String,
              icon: androidx.compose.ui.graphics.vector.ImageVector,
              accent: Color,
              panel: Color,
              fg: Color,
              modifier: Modifier = Modifier,
              onClick: () -> Unit
          ) {
              Card(
                  modifier = modifier.height(86.dp).clickable(onClick = onClick),
                  colors = CardDefaults.cardColors(containerColor = panel),
                  shape = RoundedCornerShape(20.dp)
              ) {
                  Column(
                      Modifier.fillMaxSize().padding(8.dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.Center
                  ) {
                      Icon(icon, contentDescription = null, tint = accent)
                      Spacer(Modifier.height(5.dp))
                      Text(title, color = fg, fontSize = 10.sp)
                  }
              }
          }

          @Composable
          private fun NavButton(title: String, fg: Color, onClick: () -> Unit) {
              TextButton(onClick = onClick) { Text(title, color = fg, fontSize = 10.sp) }
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Launcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
