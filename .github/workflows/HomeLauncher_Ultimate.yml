              private fun applySettings() {
                  grid.numColumns = prefs.getInt("cols", 4)
                  root.setBackgroundColor(Color.argb(prefs.getInt("dim", 0), 0, 0, 0))
                  adapter.notifyDataSetChanged()
                  buildDock()
                  val theme = prefs.getInt("theme", 1)
                  dock.background = GradientDrawable().apply {
                      cornerRadius = dp(if (theme in 1..4) 30 else 24).toFloat()
                      setColor(when (theme) {
                          1 -> Color.argb(155, 245, 245, 250)
                          2 -> Color.argb(145, 30, 30, 36)
                          3 -> Color.argb(210, 0, 0, 0)
                          4 -> Color.argb(75, 255, 255, 255)
                          5 -> Color.argb(175, 18, 18, 22)
                          6 -> Color.argb(170, 32, 32, 40)
                          7 -> Color.argb(185, 24, 31, 42)  // HiOS: глубокий сине-графитовый
                          8 -> Color.argb(185, 30, 24, 40)  // XOS: фиолетовый оттенок
                          9 -> Color.argb(105, 245, 248, 255) // iOS 26: светлое стекло
                          else -> Color.argb(90, 0, 0, 0)
                      })
                      if (theme == 4) setStroke(dp(1), Color.argb(130, 255, 255, 255))
                  }
                  applyGlass()
                  val rm = prefs.getBoolean("realme", false) || theme == 5
                  clockHolder.removeAllViews()
                  if (rm) {
                      clockHolder.addView(
                          GlassClockView(this, false, false, prefs.getBoolean("lk_24", true), prefs.getBoolean("hclock_light", false)),
                          FrameLayout.LayoutParams(dp(190), dp(104), Gravity.CENTER_HORIZONTAL)
                      )
                  }
                  askPill.visibility = if (rm) View.VISIBLE else View.GONE
                  refreshHome()
              }

