                      override fun onDismissError() { finish() }
                  })
              }

              override fun onBackPressed() { /* назад на экране блокировки не работает */ }

              override fun onDestroy() {
                  try { unregisterReceiver(unlocked) } catch (e: Throwable) { }
                  super.onDestroy()
              }
          }
