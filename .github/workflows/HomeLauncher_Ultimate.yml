              /** Редактор часов «как на iPhone» с живым предпросмотром. */
              private fun clockEditor() {
                  val cfg = LiquidCfg.load(prefs)
                  val preview = LiquidClockView(this, cfg, null)
                  val pv = FrameLayout(this).apply {
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TL_BR,
                          intArrayOf(Color.parseColor("#22304A"), Color.parseColor("#7A4E86"))
                      )
                  }
                  pv.addView(preview, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(190)).apply {
                      setMargins(dp(24), dp(8), dp(24), dp(8))
                  })

                  fun update() {
                      val lp = preview.layoutParams
                      lp.height = dp((if (cfg.stacked) 300 else 190) * cfg.heightPct / 100)
                      preview.layoutParams = lp
                      preview.invalidate()
                  }
                  fun label(t: String) = TextView(this@MainActivity).apply { text = t; setPadding(0, dp(12), 0, dp(2)) }
                  fun bar(max: Int, v: Int, f: (Int) -> Unit) = SeekBar(this@MainActivity).apply {
                      this.max = max
                      progress = v
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, u: Boolean) { f(p); update() }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  }
                  fun spin(items: List<String>, sel: Int, f: (Int) -> Unit) = Spinner(this@MainActivity).apply {
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, items)
                      setSelection(sel.coerceIn(0, items.size - 1))
                      onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                          override fun onItemSelected(a: AdapterView<*>?, v: View?, pos: Int, id: Long) { f(pos); update() }
                          override fun onNothingSelected(a: AdapterView<*>?) {}
                      }
                  }
                  fun check(t: String, v: Boolean, f: (Boolean) -> Unit) = CheckBox(this@MainActivity).apply {
                      text = t; isChecked = v
                      setOnCheckedChangeListener { _, on -> f(on); update() }
                  }

                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(20), dp(6), dp(20), 0) }
                  box.addView(label("Шрифт"))
                  box.addView(spin(LC_FONTS, cfg.font) { cfg.font = it })
                  box.addView(label("Цвет стекла"))
                  box.addView(spin(LC_COLORS.map { it.first }, LC_COLORS.indexOfFirst { it.second == cfg.color }.coerceAtLeast(0)) {
                      cfg.color = LC_COLORS[it].second
                  })
                  box.addView(check("Цифры столбиком (часы над минутами)", cfg.stacked) { cfg.stacked = it })
                  box.addView(check("Показывать дату", cfg.date) { cfg.date = it })
                  box.addView(check("24-часовой формат", cfg.h24) { cfg.h24 = it })
                  box.addView(label("Яркость стекла"))
                  box.addView(bar(140, cfg.glass) { cfg.glass = it })
                  box.addView(label("Толщина ободка"))
                  box.addView(bar(12, cfg.rim) { cfg.rim = it })
                  box.addView(label("Высота цифр"))
                  box.addView(bar(80, cfg.heightPct - 60) { cfg.heightPct = it + 60 })
                  box.addView(label("Ширина цифр"))
                  box.addView(bar(50, cfg.widthPct - 50) { cfg.widthPct = it + 50 })
                  box.addView(label("Отступ сверху"))
                  box.addView(bar(320, cfg.top) { cfg.top = it })
                  update()

                  val rootBox = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  rootBox.addView(pv, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(250)))
                  rootBox.addView(ScrollView(this).apply { addView(box) },
                      LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(250)))

                  val save = {
                      LiquidCfg.save(prefs, cfg)
                      prefs.edit().putInt("lk_style", 5).apply()
                  }
                  AlertDialog.Builder(this).setTitle("Часы как на iPhone").setView(rootBox)
                      .setPositiveButton("Сохранить") { _, _ -> save(); toast("Сохранено") }
                      .setNeutralButton("Сохранить и посмотреть") { _, _ ->
                          save(); startActivity(Intent(this, LockActivity::class.java))
                      }
                      .setNegativeButton("Отмена", null).show()
              }

