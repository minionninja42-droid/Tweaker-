name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "HomeLauncher"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          android.useAndroidX=true
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.homelauncher"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.homelauncher"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.viewpager:viewpager:1.0.0")
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SET_WALLPAPER" />
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:label="Home Launcher"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true"
                      android:windowSoftInputMode="adjustPan">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".LockActivity"
                      android:exported="false"
                      android:launchMode="singleInstance"
                      android:excludeFromRecents="true"
                      android:showWhenLocked="true"
                      android:taskAffinity=""
                      android:theme="@android:style/Theme.Material.NoActionBar" />
                  <service
                      android:name=".LockService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="custom_lock_screen" />
                  </service>
                  <service
                      android:name=".LiveWallpaperService"
                      android:exported="true"
                      android:label="Home Launcher: живые обои"
                      android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.service.wallpaper"
                          android:resource="@xml/live_wallpaper" />
                  </service>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:enabled="true"
                      android:exported="true"
                      android:multiprocess="false"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Wallpaper.NoTitleBar">
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowShowWallpaper">true</item>
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF_FILE
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/live_wallpaper.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <wallpaper xmlns:android="http://schemas.android.com/apk/res/android" />
          EOF_FILE
          mkdir -p app/src/main/java/com/example/homelauncher
          cat > app/src/main/java/com/example/homelauncher/BootReceiver.kt <<'EOF_FILE'
          package com.example.homelauncher

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.provider.Settings

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  if (i.action == Intent.ACTION_BOOT_COMPLETED &&
                      c.getSharedPreferences("home", Context.MODE_PRIVATE).getBoolean("lock", false) &&
                      Settings.canDrawOverlays(c)
                  ) {
                      try { c.startForegroundService(Intent(c, LockService::class.java)) } catch (e: Throwable) { }
                  }
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/example/homelauncher
          cat > app/src/main/java/com/example/homelauncher/GlassClock.kt <<'EOF_FILE'
          package com.example.homelauncher

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Rect
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.Typeface
          import android.view.View
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale

          /**
           * Крупные узкие цифры с «стеклянным» градиентом (сверху плотно, вниз растворяются), как в Realme UI.
           * framed = true: цифры в тонкой рамке с дугой в углу и маленькой датой (экран блокировки).
           * stacked = true: часы и минуты в два этажа.
           */
          class GlassClockView(
              ctx: Context,
              private val stacked: Boolean,
              private val framed: Boolean,
              private val h24: Boolean,
              private val light: Boolean,
              private val showDate: Boolean = true
          ) : View(ctx) {

              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val r = Rect()
              private val tick = object : Runnable {
                  override fun run() { invalidate(); postDelayed(this, 1000) }
              }

              override fun onAttachedToWindow() { super.onAttachedToWindow(); post(tick) }
              override fun onDetachedFromWindow() { removeCallbacks(tick); super.onDetachedFromWindow() }

              private fun fit(c: Canvas, text: String, left: Float, top: Float, w: Float, h: Float, maxSy: Float) {
                  p.textSize = 100f
                  p.getTextBounds(text, 0, text.length, r)
                  if (r.width() <= 0 || r.height() <= 0) return
                  val k = w / r.width()
                  val sy = minOf(h / (r.height() * k), maxSy)
                  val topCol = if (light) Color.argb(240, 255, 255, 255) else Color.argb(240, 60, 60, 64)
                  val botCol = if (light) Color.argb(40, 255, 255, 255) else Color.argb(25, 60, 60, 64)
                  p.shader = LinearGradient(0f, r.top.toFloat(), 0f, r.bottom.toFloat(), topCol, botCol, Shader.TileMode.CLAMP)
                  c.save()
                  c.translate(left, top + (h - r.height() * k * sy) / 2f)
                  c.scale(k, k * sy)
                  c.drawText(text, -r.left.toFloat(), -r.top.toFloat(), p)
                  c.restore()
                  p.shader = null
              }

              override fun onDraw(c: Canvas) {
                  val d = resources.displayMetrics.density
                  val cal = Calendar.getInstance()
                  var h = cal.get(if (h24) Calendar.HOUR_OF_DAY else Calendar.HOUR)
                  if (!h24 && h == 0) h = 12
                  val mm = "%02d".format(cal.get(Calendar.MINUTE))
                  val hh = if (framed) "%02d".format(h) else h.toString()
                  val w = width.toFloat()
                  val ht = height.toFloat()

                  p.typeface = Typeface.create("sans-serif-condensed", Typeface.BOLD)
                  p.style = Paint.Style.FILL

                  if (!framed) {
                      fit(c, "$hh:$mm", 0f, 0f, w, ht, 1.6f)
                      return
                  }

                  // рамка
                  val rect = RectF(2 * d, 2 * d, w - 2 * d, ht - 2 * d)
                  p.color = Color.argb(28, 255, 255, 255)
                  c.drawRoundRect(rect, 16 * d, 16 * d, p)
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = 2 * d
                  p.color = Color.argb(215, 255, 255, 255)
                  c.drawRoundRect(rect, 16 * d, 16 * d, p)
                  p.strokeWidth = 5 * d
                  p.strokeCap = Paint.Cap.ROUND
                  c.drawArc(RectF(rect.right - 32 * d, rect.bottom - 32 * d, rect.right, rect.bottom), 0f, 90f, false, p)
                  p.strokeCap = Paint.Cap.BUTT
                  p.style = Paint.Style.FILL

                  val pad = 14 * d
                  val topPad = if (showDate) 34 * d else pad
                  if (stacked) {
                      val gap = 8 * d
                      val lh = (ht - topPad - pad - gap) / 2f
                      fit(c, hh, pad, topPad, w - 2 * pad, lh, 2.4f)
                      fit(c, mm, pad, topPad + lh + gap, w - 2 * pad, lh, 2.4f)
                  } else {
                      fit(c, hh + mm, pad, topPad, w - 2 * pad, ht - topPad - pad, 2.4f)
                  }

                  if (showDate) {
                      p.typeface = Typeface.DEFAULT
                      p.textSize = 12 * d
                      p.color = Color.argb(225, 255, 255, 255)
                      c.drawText(SimpleDateFormat("d MMM, EEE", Locale.getDefault()).format(Date()), pad, 24 * d, p)
                  }
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/example/homelauncher
          cat > app/src/main/java/com/example/homelauncher/LiquidClock.kt <<'EOF_FILE'
          package com.example.homelauncher

          import android.content.Context
          import android.content.SharedPreferences
          import android.graphics.Bitmap
          import android.graphics.BlurMaskFilter
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.LinearGradient
          import android.graphics.Matrix
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.Rect
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.Typeface
          import android.view.View
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale

          val LC_FONTS = listOf("Жирный", "Чёрный (ультражирный)", "Узкий", "С засечками", "Тонкий", "Моно")
          val LC_COLORS = listOf(
              "Белый" to Color.WHITE,
              "Тёплый" to Color.parseColor("#FFE2B8"),
              "Голубой" to Color.parseColor("#BFE6FF"),
              "Розовый" to Color.parseColor("#FFC9E6"),
              "Зелёный" to Color.parseColor("#C6FFDD"),
              "Тёмный" to Color.parseColor("#1B1B22")
          )

          /** Настройки часов «жидкое стекло». Хранятся в SharedPreferences "home" (ключи lc_*). */
          data class LiquidCfg(
              var font: Int = 0,
              var color: Int = Color.WHITE,
              var stacked: Boolean = false,
              var glass: Int = 50,
              var rim: Int = 4,          // толщина ободка в половинках dp
              var date: Boolean = true,
              var h24: Boolean = true,
              var heightPct: Int = 100,
              var widthPct: Int = 100,
              var top: Int = 48          // отступ сверху, dp
          ) {
              companion object {
                  fun load(sp: SharedPreferences) = LiquidCfg(
                      sp.getInt("lc_font", 0),
                      sp.getInt("lc_color", Color.WHITE),
                      sp.getBoolean("lc_stacked", false),
                      sp.getInt("lc_glass", sp.getInt("lk_alpha", 50)),
                      sp.getInt("lc_rim", 4),
                      sp.getBoolean("lc_date", sp.getBoolean("lk_date", true)),
                      sp.getBoolean("lc_24", sp.getBoolean("lk_24", true)),
                      sp.getInt("lc_h", 100),
                      sp.getInt("lc_w", 100),
                      sp.getInt("lc_top", 48)
                  )

                  fun save(sp: SharedPreferences, c: LiquidCfg) {
                      sp.edit()
                          .putInt("lc_font", c.font).putInt("lc_color", c.color).putBoolean("lc_stacked", c.stacked)
                          .putInt("lc_glass", c.glass).putInt("lc_rim", c.rim).putBoolean("lc_date", c.date)
                          .putBoolean("lc_24", c.h24).putInt("lc_h", c.heightPct).putInt("lc_w", c.widthPct)
                          .putInt("lc_top", c.top).apply()
                  }
              }
          }

          /**
           * Часы «жидкое стекло» как на iPhone (iOS 26): огромные вытянутые цифры.
           * Внутри цифр — размытые обои (матовое стекло), блик, светлый ободок и мягкая тень снаружи.
           */
          class LiquidClockView(
              ctx: Context,
              var cfg: LiquidCfg,
              private val blur: Bitmap?
          ) : View(ctx) {

              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val tp = Paint(Paint.ANTI_ALIAS_FLAG)
              private val path = Path()
              private val tmp = Path()
              private val bounds = RectF()
              private val m = Matrix()
              private val loc = IntArray(2)
              private val tick = object : Runnable {
                  override fun run() { invalidate(); postDelayed(this, 1000) }
              }

              init { setLayerType(LAYER_TYPE_SOFTWARE, null) }

              override fun onAttachedToWindow() { super.onAttachedToWindow(); post(tick) }
              override fun onDetachedFromWindow() { removeCallbacks(tick); super.onDetachedFromWindow() }

              private fun typeface(): Typeface = when (cfg.font) {
                  1 -> Typeface.create("sans-serif-black", Typeface.NORMAL)
                  2 -> Typeface.create("sans-serif-condensed", Typeface.BOLD)
                  3 -> Typeface.create("serif", Typeface.BOLD)
                  4 -> Typeface.create("sans-serif-thin", Typeface.NORMAL)
                  5 -> Typeface.create("monospace", Typeface.BOLD)
                  else -> Typeface.create("sans-serif", Typeface.BOLD)
              }

              private fun textPath(s: String): RectF {
                  tmp.reset()
                  tp.getTextPath(s, 0, s.length, 0f, 0f, tmp)
                  tmp.computeBounds(bounds, true)
                  return bounds
              }

              private fun buildPath(w: Float, ht: Float, top: Float, d: Float, hour: String, min: String) {
                  path.reset()
                  tp.typeface = typeface()
                  tp.textSize = 200f
                  tp.textAlign = Paint.Align.LEFT
                  val pad = 8 * d
                  val maxW = w * cfg.widthPct / 100f
                  if (!cfg.stacked) {
                      val b = textPath("$hour:$min")
                      if (b.width() <= 0f || b.height() <= 0f) return
                      val sx = (maxW - 2 * pad) / b.width()
                      val sy = (ht - top - pad) / b.height()
                      m.reset()
                      m.postTranslate(-b.left, -b.top)
                      m.postScale(sx, sy)
                      m.postTranslate((w - maxW) / 2f + pad, top)
                      tmp.transform(m)
                      path.addPath(tmp)
                  } else {
                      val gap = 10 * d
                      val availH = (ht - top - pad - gap) / 2f
                      for (line in 0..1) {
                          val b = textPath(if (line == 0) hour else min)
                          if (b.width() <= 0f || b.height() <= 0f) continue
                          val sy = availH / b.height()
                          var sx = sy * 0.62f
                          if (b.width() * sx > maxW - 2 * pad) sx = (maxW - 2 * pad) / b.width()
                          m.reset()
                          m.postTranslate(-b.left, -b.top)
                          m.postScale(sx, sy)
                          m.postTranslate((w - b.width() * sx) / 2f, top + line * (availH + gap))
                          tmp.transform(m)
                          path.addPath(tmp)
                      }
                  }
              }

              override fun onDraw(c: Canvas) {
                  val d = resources.displayMetrics.density
                  val cal = Calendar.getInstance()
                  var h = cal.get(if (cfg.h24) Calendar.HOUR_OF_DAY else Calendar.HOUR)
                  if (!cfg.h24 && h == 0) h = 12
                  val hourS = if (cfg.stacked && cfg.h24) "%02d".format(h) else "$h"
                  val minS = "%02d".format(cal.get(Calendar.MINUTE))
                  val w = width.toFloat()
                  val ht = height.toFloat()
                  val r = Color.red(cfg.color)
                  val g = Color.green(cfg.color)
                  val b = Color.blue(cfg.color)

                  // дата сверху
                  var top = 0f
                  if (cfg.date) {
                      tp.style = Paint.Style.FILL
                      tp.shader = null
                      tp.typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                      tp.textSize = 18 * d
                      tp.textAlign = Paint.Align.CENTER
                      tp.color = Color.argb(220, r, g, b)
                      c.drawText(SimpleDateFormat("EEE, d MMM", Locale.getDefault()).format(Date()), w / 2f, 22 * d, tp)
                      top = 34 * d
                  }

                  buildPath(w, ht, top, d, hourS, minS)
                  if (path.isEmpty) return

                  // 1) мягкая тень снаружи
                  p.reset()
                  p.isAntiAlias = true
                  p.style = Paint.Style.FILL
                  p.color = Color.argb(80, 0, 0, 0)
                  p.maskFilter = BlurMaskFilter(10 * d, BlurMaskFilter.Blur.OUTER)
                  c.drawPath(path, p)

                  // 2) стекло внутри цифр
                  c.save()
                  c.clipPath(path)
                  if (blur != null) {
                      getLocationOnScreen(loc)
                      val dm = resources.displayMetrics
                      val kx = blur.width.toFloat() / dm.widthPixels
                      val ky = blur.height.toFloat() / dm.heightPixels
                      val src = Rect(
                          (loc[0] * kx).toInt(), (loc[1] * ky).toInt(),
                          ((loc[0] + width) * kx).toInt(), ((loc[1] + height) * ky).toInt()
                      )
                      c.drawBitmap(blur, src, Rect(0, 0, width, height), null)
                  }
                  val topA = (cfg.glass + if (blur != null) 50 else 110).coerceIn(0, 235)
                  val botA = (cfg.glass / 2 + if (blur != null) 15 else 60).coerceIn(0, 200)
                  p.reset()
                  p.isAntiAlias = true
                  p.style = Paint.Style.FILL
                  p.shader = LinearGradient(0f, top, 0f, ht, Color.argb(topA, r, g, b), Color.argb(botA, r, g, b), Shader.TileMode.CLAMP)
                  c.drawRect(0f, 0f, w, ht, p)
                  // блик по диагонали
                  p.shader = LinearGradient(0f, top, w * 0.85f, top + (ht - top) * 0.6f,
                      Color.argb(120, 255, 255, 255), Color.argb(0, 255, 255, 255), Shader.TileMode.CLAMP)
                  c.drawRect(0f, 0f, w, ht, p)
                  // внутреннее свечение у краёв
                  p.shader = null
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = 8 * d
                  p.color = Color.argb(75, r, g, b)
                  p.maskFilter = BlurMaskFilter(5 * d, BlurMaskFilter.Blur.NORMAL)
                  c.drawPath(path, p)
                  c.restore()

                  // 3) ободок
                  if (cfg.rim > 0) {
                      p.reset()
                      p.isAntiAlias = true
                      p.style = Paint.Style.STROKE
                      p.strokeWidth = cfg.rim * 0.5f * d
                      p.shader = LinearGradient(0f, top, 0f, ht, Color.argb(255, r, g, b), Color.argb(120, r, g, b), Shader.TileMode.CLAMP)
                      c.drawPath(path, p)
                  }
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/example/homelauncher
          cat > app/src/main/java/com/example/homelauncher/LiveWallpaperService.kt <<'EOF_FILE'
          package com.example.homelauncher

          import android.content.Context
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RadialGradient
          import android.graphics.Shader
          import android.media.MediaPlayer
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.service.wallpaper.WallpaperService
          import android.view.SurfaceHolder
          import java.io.File
          import kotlin.math.cos
          import kotlin.math.max
          import kotlin.math.sin

          /** Живые обои: анимированный градиент или зацикленное видео из галереи. */
          class LiveWallpaperService : WallpaperService() {

              override fun onCreateEngine(): Engine = E()

              inner class E : Engine() {
                  private val handler = Handler(Looper.getMainLooper())
                  private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
                  private val prefs = this@LiveWallpaperService.getSharedPreferences("home", Context.MODE_PRIVATE)
                  private var player: MediaPlayer? = null
                  private var surface: SurfaceHolder? = null
                  private var visible = false

                  // фон + три цвета «пятен»
                  private val themes = arrayOf(
                      arrayOf("#0B1026", "#2EE6A6", "#3B82F6", "#A855F7"),   // аврора
                      arrayOf("#1A0B16", "#FF7A45", "#FF3D81", "#FFC857"),   // закат
                      arrayOf("#04121F", "#0EA5E9", "#22D3EE", "#6366F1"),   // океан
                      arrayOf("#0E0E10", "#6B7280", "#9CA3AF", "#374151")    // графит
                  )

                  private val frame = object : Runnable {
                      override fun run() {
                          drawFrame()
                          if (visible && !useVideo()) handler.postDelayed(this, 33)
                      }
                  }

                  private fun videoFile() = File(this@LiveWallpaperService.filesDir, "live.mp4")
                  private fun useVideo() = prefs.getInt("live_mode", 0) == 1 && videoFile().exists()

                  private fun drawFrame() {
                      val h = surface ?: return
                      val c = try { h.lockCanvas() } catch (e: Throwable) { null } ?: return
                      try {
                          val w = c.width.toFloat()
                          val ht = c.height.toFloat()
                          val th = themes[prefs.getInt("live_theme", 0).coerceIn(0, themes.size - 1)]
                          c.drawColor(Color.parseColor(th[0]))
                          val t = SystemClock.uptimeMillis() / 1000f
                          for (i in 1..3) {
                              val cx = w * (0.5f + 0.38f * sin(t * (0.25f + 0.08f * i) + i * 2.1f))
                              val cy = ht * (0.5f + 0.38f * cos(t * (0.20f + 0.06f * i) + i * 1.7f))
                              val r = max(w, ht) * 0.6f
                              val col = Color.parseColor(th[i])
                              paint.shader = RadialGradient(
                                  cx, cy, r,
                                  Color.argb(210, Color.red(col), Color.green(col), Color.blue(col)),
                                  Color.argb(0, Color.red(col), Color.green(col), Color.blue(col)),
                                  Shader.TileMode.CLAMP
                              )
                              c.drawCircle(cx, cy, r, paint)
                          }
                          paint.shader = null
                      } finally {
                          try { h.unlockCanvasAndPost(c) } catch (e: Throwable) { }
                      }
                  }

                  private fun startVideo() {
                      val s = surface ?: return
                      stopVideo()
                      try {
                          player = MediaPlayer().apply {
                              setSurface(s.surface)
                              setDataSource(videoFile().path)
                              isLooping = true
                              setVolume(0f, 0f)
                              setVideoScalingMode(MediaPlayer.VIDEO_SCALING_MODE_SCALE_TO_FIT_WITH_CROPPING)
                              setOnPreparedListener { if (visible) it.start() }
                              prepareAsync()
                          }
                      } catch (e: Throwable) { player = null }
                  }

                  private fun stopVideo() {
                      try { player?.release() } catch (e: Throwable) { }
                      player = null
                  }

                  private fun refresh() {
                      handler.removeCallbacks(frame)
                      if (visible) {
                          if (useVideo()) {
                              if (player == null) startVideo() else try { player?.start() } catch (e: Throwable) { }
                          } else {
                              stopVideo()
                              handler.post(frame)
                          }
                      } else {
                          try { player?.pause() } catch (e: Throwable) { }
                      }
                  }

                  override fun onSurfaceCreated(holder: SurfaceHolder) {
                      super.onSurfaceCreated(holder)
                      surface = holder
                      refresh()
                  }

                  override fun onVisibilityChanged(v: Boolean) {
                      visible = v
                      refresh()
                  }

                  override fun onSurfaceDestroyed(holder: SurfaceHolder) {
                      visible = false
                      handler.removeCallbacks(frame)
                      stopVideo()
                      surface = null
                      super.onSurfaceDestroyed(holder)
                  }

                  override fun onDestroy() {
                      handler.removeCallbacks(frame)
                      stopVideo()
                      super.onDestroy()
                  }
              }
          }
