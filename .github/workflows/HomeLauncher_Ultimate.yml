                  val cbDate = CheckBox(this).apply { text = "Показывать дату"; isChecked = prefs.getBoolean("lk_date", true) }
                  val cb24 = CheckBox(this).apply { text = "24-часовой формат"; isChecked = prefs.getBoolean("lk_24", true) }
                  val cbBatt = CheckBox(this).apply { text = "Показывать заряд батареи"; isChecked = prefs.getBoolean("lk_batt", true) }
                  val cbHint = CheckBox(this).apply { text = "Подсказка «Проведите вверх»"; isChecked = prefs.getBoolean("lk_hint", true) }
                  box.addView(Button(this).apply {
                      text = "Редактор часов как на iPhone"
                      setOnClickListener { clockEditor() }
                  })
                  box.addView(label("Стиль часов")); box.addView(st)
                  box.addView(label("Яркость стекла")); box.addView(alpha)
                  box.addView(label("Цвет текста")); box.addView(cs)
                  box.addView(label("Размер часов")); box.addView(size)
                  box.addView(label("Затемнение обоев")); box.addView(dim)
                  box.addView(cbDate); box.addView(cb24); box.addView(cbBatt); box.addView(cbHint)
                  val modes = listOf("После пробуждения телефона (совместимо с AOD)", "Сразу при выключении экрана (может мешать AOD)")
                  val ms = Spinner(this).apply {
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, modes)
                      setSelection(prefs.getInt("lk_mode", 0).coerceIn(0, 1))
                  }
                  box.addView(label("Когда показывать экран блокировки")); box.addView(ms)
                  box.addView(label(if (File(filesDir, "lockglass.jpg").exists()) "Размытие под стеклом: активно"
                      else "Для размытия задайте обои: Обои → Экран блокировки"))
                  val save = {
                      prefs.edit()
                          .putInt("lk_style", st.selectedItemPosition)
                          .putInt("lk_alpha", alpha.progress)
                          .putInt("lk_color", colors[cs.selectedItemPosition].second)
                          .putInt("lk_size", size.progress + 40)
                          .putInt("lk_dim", dim.progress)
                          .putBoolean("lk_date", cbDate.isChecked)
                          .putBoolean("lk_24", cb24.isChecked)
                          .putBoolean("lk_batt", cbBatt.isChecked)
                          .putBoolean("lk_hint", cbHint.isChecked)
                          .putInt("lk_mode", ms.selectedItemPosition).apply()
                  }
                  AlertDialog.Builder(this).setTitle("Экран блокировки").setView(ScrollView(this).apply { addView(box) })
                      .setPositiveButton("Сохранить") { _, _ -> save() }
                      .setNeutralButton("Сохранить и посмотреть") { _, _ ->
                          save(); startActivity(Intent(this, LockActivity::class.java))
                      }
                      .setNegativeButton("Отмена", null).show()
              }

              // ================= вырез экрана (через Shizuku) =================

              private val cutoutNames = listOf(
                  "Вариант по умолчанию", "Вырез на экране Waterfall", "Сверху и снизу", "Вырез Punch Hole",
                  "Сверху (узкий)", "Сверху (широкий)", "Сверху (высокий)", "В правом углу"
              )
              private val cutoutIds = listOf("", "waterfall", "double", "hole", "narrow", "wide", "tall", "corner")

              private val shizukuListener = Shizuku.OnRequestPermissionResultListener { _, _ ->
                  runOnUiThread { toast("Доступ Shizuku: " + if (shizukuOk()) "выдан" else "отказано") }
              }

              private fun shizukuOk() = try {
                  Shizuku.pingBinder() && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
              } catch (e: Throwable) { false }

              private fun requestShizuku() {
                  try {
                      if (!Shizuku.pingBinder()) toast("Shizuku не запущен. Откройте Shizuku и нажмите Start")
                      else Shizuku.requestPermission(0)
                  } catch (e: Throwable) { toast("Shizuku не установлен") }
              }

              private fun shizukuSh(cmd: String): String {
                  val m = Shizuku::class.java.getDeclaredMethod(
                      "newProcess", Array<String>::class.java, Array<String>::class.java, String::class.java
                  )
                  m.isAccessible = true
                  val p = m.invoke(null, arrayOf("sh", "-c", cmd), null, null) as Process
                  val out = p.inputStream.bufferedReader().readText() + p.errorStream.bufferedReader().readText()
                  p.waitFor()
                  return out.trim()
              }

              private fun applyCutout(i: Int) {
                  if (!shizukuOk()) { toast("Нужен доступ Shizuku: запустите Shizuku и нажмите «Доступ Shizuku»"); return }
                  val base = "com.android.internal.display.cutout.emulation"
                  val all = listOf("corner", "double", "narrow", "wide", "tall", "hole", "waterfall")
                  val off = all.joinToString("; ") { "cmd overlay disable $base.$it" }
                  val cmd = if (cutoutIds[i].isEmpty()) off else "$off; cmd overlay enable $base.${cutoutIds[i]}"
                  thread {
                      val r = try { shizukuSh(cmd) } catch (e: Throwable) { "Ошибка: ${e.message}" }
                      runOnUiThread {
                          prefs.edit().putInt("cutout", i).apply()
                          toast(if (r.isEmpty()) "Вырез: ${cutoutNames[i]}" else r.take(160))
                      }
                  }
              }

              private fun cutoutDialog() {
                  AlertDialog.Builder(this).setTitle("Вырез на экране")
                      .setSingleChoiceItems(cutoutNames.toTypedArray(), prefs.getInt("cutout", 0)) { d, i ->
                          d.dismiss(); applyCutout(i)
                      }
                      .setNeutralButton("Доступ Shizuku") { _, _ -> requestShizuku() }
                      .setNegativeButton("Отмена", null).show()
              }

              // ================= живые обои =================

              private fun liveDialog() {
                  val opts = arrayOf(
                      "Анимация: Аврора", "Анимация: Закат", "Анимация: Океан", "Анимация: Графит",
                      "Видео из галереи…", "Установить как обои"
                  )
                  AlertDialog.Builder(this).setTitle("Живые обои").setItems(opts) { _, i ->
                      when {
                          i in 0..3 -> {
                              prefs.edit().putInt("live_mode", 0).putInt("live_theme", i).apply()
                              setLive()
                          }
                          i == 4 -> startActivityForResult(
                              Intent.createChooser(Intent(Intent.ACTION_GET_CONTENT).setType("video/*"), "Видео"), 78
                          )
                          else -> setLive()
                      }
                  }.show()
              }

              private fun setLive() {
                  val comp = ComponentName(this, LiveWallpaperService::class.java)
                  try {
                      startActivity(
                          Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER)
                              .putExtra(WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT, comp)
                      )
                  } catch (e: Throwable) {
                      try { startActivity(Intent(WallpaperManager.ACTION_LIVE_WALLPAPER_CHOOSER)) }
                      catch (e2: Throwable) { toast("Откройте Настройки → Обои → Живые обои") }
                  }
              }

              private fun cropToScreen(src: Bitmap): Bitmap {
                  val dm = resources.displayMetrics
                  val tw = dm.widthPixels
                  val th = dm.heightPixels
                  val scale = maxOf(tw.toFloat() / src.width, th.toFloat() / src.height)
                  val nw = maxOf(tw, ceil(src.width * scale).toInt())
                  val nh = maxOf(th, ceil(src.height * scale).toInt())
                  val scaled = Bitmap.createScaledBitmap(src, nw, nh, true)
                  return Bitmap.createBitmap(scaled, (nw - tw) / 2, (nh - th) / 2, tw, th)
              }

              private fun wallpaperDialog() {
                  AlertDialog.Builder(this).setTitle("Куда поставить обои")
                      .setItems(arrayOf("Домашний экран", "Экран блокировки", "Оба экрана", "Живые обои…")) { _, i ->
                          if (i == 3) { liveDialog(); return@setItems }
                          wallTarget = i
                          startActivityForResult(Intent.createChooser(Intent(Intent.ACTION_GET_CONTENT).setType("image/*"), "Обои"), 77)
                      }.show()
              }

              private fun decode(uri: Uri): Bitmap {
                  val dm = resources.displayMetrics
                  val tw = dm.widthPixels
                  val th = dm.heightPixels
                  val o = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  contentResolver.openInputStream(uri)!!.use { BitmapFactory.decodeStream(it, null, o) }
                  var s = 1
                  while (o.outWidth / (s * 2) >= tw && o.outHeight / (s * 2) >= th) s *= 2
                  val o2 = BitmapFactory.Options().apply { inSampleSize = s }
                  val src = contentResolver.openInputStream(uri)!!.use { BitmapFactory.decodeStream(it, null, o2) }!!
                  val scale = maxOf(tw.toFloat() / src.width, th.toFloat() / src.height)
                  val nw = maxOf(tw, ceil(src.width * scale).toInt())
                  val nh = maxOf(th, ceil(src.height * scale).toInt())
                  val scaled = Bitmap.createScaledBitmap(src, nw, nh, true)
                  return Bitmap.createBitmap(scaled, (nw - tw) / 2, (nh - th) / 2, tw, th)
              }

              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (req == 88) { if (res == RESULT_OK) afterBind(pendingId) else host.deleteAppWidgetId(pendingId); return }
                  if (req == 89) { if (res == RESULT_OK) addWidget(pendingId) else host.deleteAppWidgetId(pendingId); return }
                  if (req == 78 && res == RESULT_OK) {
                      val uri = data?.data ?: return
                      toast("Загружаю видео…")
                      thread {
                          try {
                              val out = File(filesDir, "live.mp4")
                              contentResolver.openInputStream(uri)!!.use { inp -> out.outputStream().use { inp.copyTo(it) } }
                              prefs.edit().putInt("live_mode", 1).apply()
                              // кадр из видео — для размытия под стеклом и фона своего экрана блокировки
                              val mmr = MediaMetadataRetriever()
                              mmr.setDataSource(out.path)
                              val fr = mmr.getFrameAtTime(1_000_000L, MediaMetadataRetriever.OPTION_CLOSEST_SYNC)
                              mmr.release()
                              if (fr != null) {
                                  val bmp = cropToScreen(fr)
                                  saveGlass(bmp)
                                  saveGlass(bmp, "lockglass.jpg")
                                  saveJpeg(bmp, "lockbg.jpg")
                              }
                              runOnUiThread { loadGlass(); applyGlass(); setLive() }
                          } catch (e: Throwable) {
                              runOnUiThread { toast("Ошибка: ${e.message}") }
                          }
                      }
                      return
                  }
                  if (req == 77 && res == RESULT_OK) {
                      val uri = data?.data ?: return
                      toast("Устанавливаю обои…")
                      thread {
                          try {
                              val flags = when (wallTarget) {
                                  0 -> WallpaperManager.FLAG_SYSTEM
                                  1 -> WallpaperManager.FLAG_LOCK
                                  else -> WallpaperManager.FLAG_SYSTEM or WallpaperManager.FLAG_LOCK
                              }
                              val bmp = decode(uri)
                              WallpaperManager.getInstance(this).setBitmap(bmp, null, true, flags)
                              if (wallTarget != 1) saveGlass(bmp)
                              if (wallTarget != 0) { saveJpeg(bmp, "lockbg.jpg"); saveGlass(bmp, "lockglass.jpg") }
                              runOnUiThread { loadGlass(); applyGlass(); toast("Обои установлены") }
                          } catch (e: Throwable) {
                              runOnUiThread { toast("Ошибка: ${e.message}") }
                          }
                      }
                  }
              }

              // ================= список всех приложений =================

              inner class AppAdapter : BaseAdapter() {
                  override fun getCount() = shown.size
                  override fun getItem(i: Int) = shown[i]
                  override fun getItemId(i: Int) = i.toLong()
                  override fun getView(i: Int, v: View?, p: ViewGroup?): View {
                      val a = shown[i]
                      val v2 = iconView(a, {}, {})
                      v2.setOnClickListener(null); v2.setOnLongClickListener(null)
                      v2.isClickable = false; v2.isLongClickable = false
                      v2.setPadding(dp(4), dp(10), dp(4), dp(10))
                      return v2
                  }
              }

              // ================= создание =================

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = getSharedPreferences("home", MODE_PRIVATE)
                  awm = AppWidgetManager.getInstance(this)
                  try { Shizuku.addRequestPermissionResultListener(shizukuListener) } catch (e: Throwable) { }
                  host = AppWidgetHost(this, 1024)
                  pageCount = prefs.getInt("pages", 2)
                  loadItems()

                  root = FrameLayout(this)
                  root.setOnApplyWindowInsetsListener { v, ins ->
                      v.setPadding(0, ins.systemWindowInsetTop, 0, ins.systemWindowInsetBottom)
                      ins
                  }

                  // --- главный экран ---
                  val home = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  clockHolder = FrameLayout(this)
                  home.addView(clockHolder, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))
                  pager = ViewPager(this).apply {
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f)
                      setPadding(dp(8), dp(8), dp(8), 0)
                      clipToPadding = false
                      addOnPageChangeListener(object : ViewPager.SimpleOnPageChangeListener() {
                          override fun onPageSelected(position: Int) { updateDots() }
                      })
                  }
                  pager.adapter = PagesAdapter()
                  home.addView(pager)

                  askPill = TextView(this).apply {
                      text = "✦  Искать приложения"
                      textSize = 14f; setTextColor(Color.parseColor("#33333A")); gravity = Gravity.CENTER
                      setPadding(dp(22), dp(10), dp(22), dp(10))
                      background = GradientDrawable().apply {
                          cornerRadius = dp(24).toFloat(); setColor(Color.argb(170, 255, 255, 255)); setStroke(2, Color.argb(200, 255, 255, 255))
                      }
                      visibility = View.GONE
                      setOnClickListener { openDrawer() }
                  }
                  home.addView(askPill, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT
                  ).apply { gravity = Gravity.CENTER_HORIZONTAL; topMargin = dp(4) })

                  dots = TextView(this).apply {
                      gravity = Gravity.CENTER; setTextColor(Color.WHITE); textSize = 10f
                      setShadowLayer(4f, 0f, 1f, Color.BLACK)
                      setPadding(0, dp(6), 0, dp(6))
                  }
                  home.addView(dots)

                  dock = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      setPadding(dp(8), dp(10), dp(8), dp(10))
                      background = GradientDrawable().apply { cornerRadius = dp(28).toFloat(); setColor(Color.argb(90, 0, 0, 0)) }
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply { setMargins(dp(12), dp(0), dp(12), dp(12)) }
                  }
                  home.addView(dock)
                  root.addView(home, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))

                  // --- список всех приложений (поверх) ---
                  drawer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.argb(225, 0, 0, 0))
                      visibility = View.GONE
                      isClickable = true
                  }
                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(12), dp(10), dp(12), dp(4))
                  }
                  search = EditText(this).apply {
                      hint = "Название или пакет приложения"
                      setHintTextColor(Color.argb(160, 255, 255, 255))
                      setTextColor(Color.WHITE); textSize = 15f
                      inputType = InputType.TYPE_CLASS_TEXT; setSingleLine()
                      setPadding(dp(16), dp(10), dp(16), dp(10))
                      background = GradientDrawable().apply { cornerRadius = dp(24).toFloat(); setColor(Color.argb(90, 255, 255, 255)) }
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      addTextChangedListener(object : TextWatcher {
                          override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                          override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                          override fun afterTextChanged(s: Editable?) { applyFilter() }
                      })
                  }
                  bar.addView(search)
                  bar.addView(TextView(this).apply {
                      text = "⚙"; textSize = 26f; setTextColor(Color.WHITE)
                      setPadding(dp(14), 0, dp(6), 0)
                      setOnClickListener { settingsDialog() }
                  })
                  drawer.addView(bar)

                  adapter = AppAdapter()
                  grid = GridView(this).apply {
                      numColumns = prefs.getInt("cols", 4)
                      adapter = this@MainActivity.adapter
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f)
                      setPadding(dp(8), dp(4), dp(8), dp(4))
                      clipToPadding = false
                      selector = ColorDrawable(Color.TRANSPARENT)
                      setOnItemClickListener { _, _, i, _ -> launch(shown[i].pkg); closeDrawer() }
                      setOnItemLongClickListener { _, _, i, _ -> appMenu(shown[i]); true }
                  }
                  drawer.addView(grid)
                  root.addView(drawer, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))

                  editBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      visibility = View.GONE
                      setPadding(dp(8), dp(12), dp(8), dp(12))
                      background = GradientDrawable().apply {
                          cornerRadius = dp(26).toFloat()
                          setColor(Color.argb(200, 24, 24, 28))
                          setStroke(2, Color.argb(90, 255, 255, 255))
                      }
                  }
                  fun editItem(sym: String, name: String, f: () -> Unit) {
                      val t = TextView(this).apply {
                          text = "$sym\n$name"; textSize = 12f; setTextColor(Color.WHITE); gravity = Gravity.CENTER
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                          setOnClickListener { f() }
                      }
                      editBar.addView(t)
                  }
                  editItem("🖼", "Обои") { wallpaperDialog() }
                  editItem("▤", "Виджеты") { pickWidget() }
                  editItem("⧉", "Страницы") { pagesDialog() }
                  editItem("⚙", "Настройки") { settingsDialog() }
                  editItem("✔", "Готово") { editBar.visibility = View.GONE }
                  root.addView(editBar, FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.BOTTOM
                  ).apply { setMargins(dp(12), 0, dp(12), dp(16)) })

                  setContentView(root)
                  loadGlass()
                  applySettings()
                  if (prefs.getBoolean("lock", false) && Settings.canDrawOverlays(this)) startLock(true)
              }

              override fun onDestroy() {
                  try { Shizuku.removeRequestPermissionResultListener(shizukuListener) } catch (e: Throwable) { }
                  super.onDestroy()
              }

              override fun onStart() {
                  super.onStart()
                  try { host.startListening() } catch (e: Throwable) { }
              }

              override fun onStop() {
                  try { host.stopListening() } catch (e: Throwable) { }
                  super.onStop()
              }

              override fun onResume() {
                  super.onResume()
                  loadApps()
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  closeDrawer()
                  moving = null
                  if (resizing != null) { resizing = null; refreshHome() }
                  pager.currentItem = 0
              }

              override fun onBackPressed() {
                  when {
                      drawer.visibility == View.VISIBLE -> closeDrawer()
                      editBar.visibility == View.VISIBLE -> editBar.visibility = View.GONE
                      moving != null -> { moving = null; toast("Перемещение отменено") }
                      resizing != null -> { resizing = null; refreshHome() }
                  }
              }
          }
