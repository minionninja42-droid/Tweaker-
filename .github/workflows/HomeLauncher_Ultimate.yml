          /** Страница рабочего стола: сетка ячеек, элементы ставятся по координатам. */
          class CellLayout(ctx: Context, private val cols: Int, private val rows: Int) : ViewGroup(ctx) {
              class LP(var x: Int, var y: Int, var w: Int, var h: Int) :
                  ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)

              var lastX = 0f
              var lastY = 0f

              override fun checkLayoutParams(p: ViewGroup.LayoutParams?) = p is LP

              override fun onMeasure(ws: Int, hs: Int) {
                  val w = View.MeasureSpec.getSize(ws)
                  val h = View.MeasureSpec.getSize(hs)
                  setMeasuredDimension(w, h)
                  val cw = w / cols
                  val ch = h / rows
                  for (i in 0 until childCount) {
                      val c = getChildAt(i)
                      val lp = c.layoutParams as LP
                      c.measure(
                          View.MeasureSpec.makeMeasureSpec(cw * lp.w, View.MeasureSpec.EXACTLY),
                          View.MeasureSpec.makeMeasureSpec(ch * lp.h, View.MeasureSpec.EXACTLY)
                      )
                  }
              }

              override fun onLayout(changed: Boolean, l: Int, t: Int, r: Int, b: Int) {
                  val cw = (r - l) / cols
                  val ch = (b - t) / rows
                  for (i in 0 until childCount) {
                      val c = getChildAt(i)
                      val lp = c.layoutParams as LP
                      c.layout(lp.x * cw, lp.y * ch, (lp.x + lp.w) * cw, (lp.y + lp.h) * ch)
                  }
              }

              fun cellX(x: Float) = (x / (width / cols)).toInt().coerceIn(0, cols - 1)
              fun cellY(y: Float) = (y / (height / rows)).toInt().coerceIn(0, rows - 1)
          }

          /** «Стекло»: кусок размытых обоев под панелью + белая вуаль, блик и светлая рамка. */
          class GlassDrawable(
              private val v: View,
              private val radius: Float,
              private val blur: Bitmap?,
              private val tint: Int
          ) : Drawable() {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val path = Path()
              private val loc = IntArray(2)

              override fun draw(c: Canvas) {
                  val b = bounds
                  val rect = RectF(b)
                  path.reset()
                  path.addRoundRect(rect, radius, radius, Path.Direction.CW)
                  c.save()
                  c.clipPath(path)
                  if (blur != null) {
                      v.getLocationOnScreen(loc)
                      val dm = v.resources.displayMetrics
                      val sx = blur.width.toFloat() / dm.widthPixels
                      val sy = blur.height.toFloat() / dm.heightPixels
                      val src = Rect(
                          (loc[0] * sx).toInt(), (loc[1] * sy).toInt(),
                          ((loc[0] + b.width()) * sx).toInt(), ((loc[1] + b.height()) * sy).toInt()
                      )
                      c.drawBitmap(blur, src, b, null)
                  }
                  p.style = Paint.Style.FILL
                  p.color = tint
                  c.drawRect(rect, p)
                  p.shader = LinearGradient(
                      0f, rect.top, 0f, rect.bottom,
                      Color.argb(70, 255, 255, 255), Color.argb(0, 255, 255, 255), Shader.TileMode.CLAMP
                  )
                  c.drawRect(rect, p)
                  p.shader = null
                  c.restore()
                  if (radius > 0f) {
                      p.style = Paint.Style.STROKE
                      p.strokeWidth = 2f
                      p.color = Color.argb(120, 255, 255, 255)
                      c.drawPath(path, p)
                  }
              }

              override fun setAlpha(a: Int) {}
              override fun setColorFilter(f: ColorFilter?) {}
              @Suppress("OVERRIDE_DEPRECATION")
              override fun getOpacity() = PixelFormat.TRANSLUCENT
          }

          /** Рамка поверх элемента: тяните за середину — двигать, за белые точки — менять размер (только виджеты). */
          class ResizeOverlay(
              ctx: Context,
              private val resizable: Boolean,
              private val onDrag: (dx: Float, dy: Float, rw: Boolean, rh: Boolean, mv: Boolean, done: Boolean) -> Unit
          ) : View(ctx) {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private var sx = 0f
              private var sy = 0f
              private var rw = false
              private var rh = false
              private var mv = false

              override fun onDraw(c: Canvas) {
                  val d = resources.displayMetrics.density
                  p.style = Paint.Style.FILL
                  p.color = Color.argb(40, 255, 255, 255)
                  c.drawRoundRect(RectF(2 * d, 2 * d, width - 2 * d, height - 2 * d), 12 * d, 12 * d, p)
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = 3 * d
                  p.color = Color.WHITE
                  c.drawRoundRect(RectF(2 * d, 2 * d, width - 2 * d, height - 2 * d), 12 * d, 12 * d, p)
                  if (resizable) {
                      p.style = Paint.Style.FILL
                      c.drawCircle(width - 2 * d, height / 2f, 10 * d, p)
                      c.drawCircle(width / 2f, height - 2 * d, 10 * d, p)
                      c.drawCircle(width - 2 * d, height - 2 * d, 13 * d, p)
                  }
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  val d = resources.displayMetrics.density
                  when (e.action) {
                      MotionEvent.ACTION_DOWN -> {
                          parent.requestDisallowInterceptTouchEvent(true)
                          sx = e.rawX; sy = e.rawY
                          rw = resizable && e.x > width - 44 * d
                          rh = resizable && e.y > height - 44 * d
                          mv = !rw && !rh
                      }
                      MotionEvent.ACTION_MOVE -> onDrag(e.rawX - sx, e.rawY - sy, rw, rh, mv, false)
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> onDrag(e.rawX - sx, e.rawY - sy, rw, rh, mv, true)
                  }
                  return true
              }
          }

          /** Плитка иконки: заливка + рамка с градиентом (подсветка или тень), как в настройках «Icon pack» из видео. */
          class IconTileDrawable(
              private val radius: Float,
              private val fillAlpha: Int,
              private val borderStyle: Int,   // 0 — нет, 1 — подсветка, 2 — тень
              private val borderPx: Float,
              private val intensity: Int,     // 0..100
              private val angleDeg: Int
          ) : Drawable() {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)

              override fun draw(c: Canvas) {
                  val b = bounds
                  val r = RectF(b)
                  p.style = Paint.Style.FILL
                  p.shader = LinearGradient(
                      0f, r.top, 0f, r.bottom,
                      Color.argb(fillAlpha, 255, 255, 255),
                      Color.argb((fillAlpha * 0.82f).toInt(), 232, 232, 238),
                      Shader.TileMode.CLAMP
                  )
                  c.drawRoundRect(r, radius, radius, p)
                  p.shader = null
                  if (borderStyle != 0 && borderPx > 0f) {
                      val a = (intensity.coerceIn(0, 100) * 255 / 100)
                      val rad = Math.toRadians(angleDeg.toDouble())
                      val dx = Math.cos(rad).toFloat()
                      val dy = Math.sin(rad).toFloat()
                      val cx = r.centerX()
                      val cy = r.centerY()
                      val len = maxOf(r.width(), r.height()) / 2f
                      val col = if (borderStyle == 1) Color.argb(a, 255, 255, 255) else Color.argb(a, 0, 0, 0)
                      val none = if (borderStyle == 1) Color.argb(0, 255, 255, 255) else Color.argb(0, 0, 0, 0)
                      p.shader = LinearGradient(cx - dx * len, cy - dy * len, cx + dx * len, cy + dy * len, col, none, Shader.TileMode.CLAMP)
                      p.style = Paint.Style.STROKE
                      p.strokeWidth = borderPx
                      val h = borderPx / 2f
                      c.drawRoundRect(RectF(r.left + h, r.top + h, r.right - h, r.bottom - h), radius, radius, p)
                      p.shader = null
                  }
              }

              override fun setAlpha(a: Int) {}
              override fun setColorFilter(f: ColorFilter?) {}
              @Suppress("OVERRIDE_DEPRECATION")
              override fun getOpacity() = PixelFormat.TRANSLUCENT
          }

          class MainActivity : Activity() {

              data class App(val pkg: String, val label: String, val icon: Drawable, val mono: Drawable? = null)
              data class Item(val type: String, var page: Int, var x: Int, var y: Int, var w: Int, var h: Int, var ref: String)

              private val C = 4
              private val R = 6

              private lateinit var prefs: SharedPreferences
              private lateinit var awm: AppWidgetManager
              private lateinit var host: AppWidgetHost
              private lateinit var root: FrameLayout
              private lateinit var pager: ViewPager
              private lateinit var dots: TextView
              private lateinit var dock: LinearLayout
              private lateinit var clockHolder: FrameLayout
              private lateinit var askPill: TextView
              private lateinit var editBar: LinearLayout
              private lateinit var drawer: LinearLayout
              private lateinit var grid: GridView
              private lateinit var search: EditText
              private lateinit var adapter: AppAdapter

              private val all = mutableListOf<App>()
              private val shown = mutableListOf<App>()
              private val items = mutableListOf<Item>()
              private var pageCount = 2
              private var moving: Item? = null
              private var resizing: Item? = null
              private var pendingId = -1
              private var wallTarget = 0
              private var glassBmp: Bitmap? = null

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()
              private var lastTx = 0
              private var lastTy = 0

              override fun dispatchTouchEvent(e: MotionEvent): Boolean {
                  if (e.action == MotionEvent.ACTION_DOWN) { lastTx = e.rawX.toInt(); lastTy = e.rawY.toInt() }
                  return super.dispatchTouchEvent(e)
              }

              /** Запуск приложения с анимацией «разворачивания» из места нажатия. */
              private fun launch(pkg: String) {
                  val intent = packageManager.getLaunchIntentForPackage(pkg) ?: return
                  if (prefs.getBoolean("open_anim", true)) {
                      try {
                          val loc = IntArray(2)
                          root.getLocationOnScreen(loc)
                          val o = ActivityOptions.makeScaleUpAnimation(root, lastTx - loc[0], lastTy - loc[1], 1, 1)
                          startActivity(intent, o.toBundle())
                          return
                      } catch (e: Throwable) { }
                  }
                  startActivity(intent)
              }

              /** Свой DPI («наименьшая ширина») только для лаунчера, без Shizuku. */
              override fun attachBaseContext(newBase: Context) {
                  val w = newBase.getSharedPreferences("home", Context.MODE_PRIVATE).getInt("target_w", 0)
                  if (w >= 300) {
                      val dm = newBase.resources.displayMetrics
                      val px = minOf(dm.widthPixels, dm.heightPixels)
                      val cfg = Configuration(newBase.resources.configuration)
                      cfg.densityDpi = 160 * px / w
                      super.attachBaseContext(newBase.createConfigurationContext(cfg))
                  } else super.attachBaseContext(newBase)
              }

              // ================= данные =================

              private fun loadItems() {
                  items.clear()
                  val arr = JSONArray(prefs.getString("items", "[]"))
                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      items.add(Item(o.getString("t"), o.getInt("p"), o.getInt("x"), o.getInt("y"), o.getInt("w"), o.getInt("h"), o.getString("r")))
                  }
              }

              private fun saveItems() {
                  val arr = JSONArray()
                  for (it in items) {
                      arr.put(JSONObject().put("t", it.type).put("p", it.page).put("x", it.x).put("y", it.y)
                          .put("w", it.w).put("h", it.h).put("r", it.ref))
                  }
                  prefs.edit().putString("items", arr.toString()).apply()
              }

              private fun dockList() = (prefs.getString("dock", "") ?: "").split(",").filter { it.isNotEmpty() }
              private fun saveDock(l: List<String>) = prefs.edit().putString("dock", l.joinToString(",")).apply()

              private fun isFree(page: Int, x: Int, y: Int, w: Int, h: Int, ignore: Item?): Boolean {
                  if (x < 0 || y < 0 || x + w > C || y + h > R) return false
                  return items.none {
                      it !== ignore && it.page == page &&
                          x < it.x + it.w && it.x < x + w && y < it.y + it.h && it.y < y + h
                  }
              }

              private fun placeNew(type: String, ref: String, w: Int, h: Int): Boolean {
                  val cur = pager.currentItem
                  val order = listOf(cur) + (0 until pageCount).filter { it != cur }
                  for (p in order) {
                      for (y in 0..(R - h)) for (x in 0..(C - w)) {
                          if (isFree(p, x, y, w, h, null)) {
                              items.add(Item(type, p, x, y, w, h, ref))
                              saveItems()
                              return true
                          }
                      }
                  }
                  toast("Нет места на рабочем столе")
                  return false
              }

              private fun loadApps() {
                  thread {
                      val q = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                      val list = packageManager.queryIntentActivities(q, 0)
                          .filter { it.activityInfo.packageName != packageName }
                          .map {
                              val ic = it.loadIcon(packageManager)
                              val mono = if (Build.VERSION.SDK_INT >= 33 && ic is AdaptiveIconDrawable) ic.monochrome else null
                              App(it.activityInfo.packageName, it.loadLabel(packageManager).toString(), ic, mono)
                          }
                          .distinctBy { it.pkg }
                          .sortedBy { it.label.lowercase() }
                      runOnUiThread {
                          val changed = list.map { it.pkg } != all.map { it.pkg }
                          all.clear(); all.addAll(list)
                          // чистим удалённые приложения и виджеты
                          val before = items.size
                          items.removeAll { i ->
                              (i.type == "app" && all.none { it.pkg == i.ref }) ||
                                  (i.type == "widget" && awm.getAppWidgetInfo(i.ref.toInt()) == null)
                          }
                          if (items.size != before) saveItems()
                          applyFilter(); buildDock()
                          if (changed || items.size != before) refreshHome()
                      }
                  }
              }

              private fun applyFilter() {
                  val hidden = prefs.getStringSet("hidden", emptySet())!!
                  val q = search.text.toString().trim().lowercase(Locale.ROOT)
                  shown.clear()
                  val matches = all.filter { app ->
                      app.pkg !in hidden && (
                          q.isEmpty() ||
                          app.label.lowercase(Locale.ROOT).contains(q) ||
                          app.pkg.lowercase(Locale.ROOT).contains(q)
                      )
                  }
                  val sortMode = prefs.getInt("app_sort", 0)
                  shown.addAll(when (sortMode) {
                      1 -> matches.sortedWith(compareBy<App> { !it.label.lowercase(Locale.ROOT).startsWith(q) }
                          .thenByDescending { it.label.lowercase(Locale.ROOT) })
                      2 -> matches.sortedBy { it.pkg.lowercase(Locale.ROOT) }
                      else -> matches.sortedWith(compareBy<App> { !it.label.lowercase(Locale.ROOT).startsWith(q) }
                          .thenBy { it.label.lowercase(Locale.ROOT) })
                  })
                  adapter.notifyDataSetChanged()
              }

              // ================= рабочий стол =================

              private fun refreshHome() {
                  pager.adapter?.notifyDataSetChanged()
                  updateDots()
              }

              private fun updateDots() {
                  dots.text = (0 until pageCount).joinToString("  ") { if (it == pager.currentItem) "●" else "○" }
              }

              private fun iconImage(a: App, size: Int): ImageView {
                  val iv = ImageView(this).apply { layoutParams = LinearLayout.LayoutParams(size, size) }
                  val theme = prefs.getInt("theme", 1)
                  if (theme == 5 || prefs.getBoolean("realme", false)) {
                      val pad = (size * 0.2f).toInt()
                      iv.setPadding(pad, pad, pad, pad)
                      iv.background = IconTileDrawable(
                          size * prefs.getInt("ic_round", 30) / 100f,
                          prefs.getInt("tile_alpha", 238),
                          prefs.getInt("ib_style", 1),
                          dp(1) * prefs.getInt("ib_width", 3) / 2f,
                          prefs.getInt("ib_int", 100),
                          prefs.getInt("ib_angle", 90)
                      )
                      val mono = a.mono
                      if (mono != null) {
                          iv.setImageDrawable(mono)
                          iv.setColorFilter(Color.parseColor("#4A4A50"))
                      } else {
                          iv.setImageDrawable(a.icon)
                          iv.colorFilter = ColorMatrixColorFilter(ColorMatrix().apply { setSaturation(0f) })
                      }
                  } else iv.setImageDrawable(a.icon)
                  if (theme in 1..4 || theme == 9) {
                      iv.background = GradientDrawable().apply {
                          cornerRadius = size * 0.23f
                          setColor(if (theme == 3) Color.BLACK else Color.TRANSPARENT)
                      }
                      iv.clipToOutline = true
                  }
                  return iv
              }

              private fun iconView(a: App, onClick: () -> Unit, onLong: () -> Unit): View {
                  val size = dp(prefs.getInt("icon", 56))
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setOnClickListener { onClick() }
                      setOnLongClickListener { onLong(); true }
                  }
                  col.addView(iconImage(a, size))
                  if (prefs.getBoolean("labels", true)) {
                      col.addView(TextView(this).apply {
                          text = a.label; setTextColor(if (prefs.getInt("theme", 1) == 1) Color.WHITE else Color.WHITE); textSize = 12f
                          maxLines = 1; ellipsize = TextUtils.TruncateAt.END; gravity = Gravity.CENTER
                          setShadowLayer(4f, 0f, 1f, Color.BLACK)
                          setPadding(dp(2), dp(4), dp(2), 0)
                      })
                  }
                  return col
              }

              private fun makeView(item: Item): View? {
                  if (item.type == "app") {
                      val a = all.firstOrNull { it.pkg == item.ref } ?: return null
                      return iconView(a, { launch(a.pkg) }, { itemMenu(item) })
                  }
                  if (item.type == "folder") {
                      val folderParts = item.ref.split("|", limit = 2)
                      val folderName = folderParts.firstOrNull()?.takeIf { it.isNotBlank() } ?: "Папка"
                      val pkgs = folderParts.getOrNull(1).orEmpty().split(";").filter { it.isNotBlank() }
                      val theme = prefs.getInt("theme", 1)
                      val tile = FrameLayout(this).apply {
                          background = GradientDrawable().apply {
                              cornerRadius = dp(if (theme in 1..3) 20 else 16).toFloat()
                              setColor(when (theme) {
                                  2 -> Color.argb(150, 35, 35, 40)
                                  3 -> Color.argb(190, 8, 8, 10)
                                  4 -> Color.argb(105, 255, 255, 255)
                                  7 -> Color.argb(190, 35, 48, 65)
                                  8 -> Color.argb(190, 48, 34, 62)
                                  9 -> Color.argb(150, 245, 248, 255)
                                  else -> Color.argb(190, 235, 235, 242)
                              })
                              if (theme == 4) setStroke(dp(1), Color.argb(100, 255, 255, 255))
                          }
                          setOnClickListener { openFolder(item) }
                          setOnLongClickListener { itemMenu(item); true }
                      }
                      val preview = GridLayout(this).apply {
                          rowCount = 2; columnCount = 2
                          setPadding(dp(7), dp(7), dp(7), dp(7))
                      }
                      pkgs.take(4).forEach { pkg ->
                          all.firstOrNull { it.pkg == pkg }?.let { a ->
                              preview.addView(iconImage(a, dp(23)), ViewGroup.LayoutParams(dp(25), dp(25)))
                          }
                      }
                      tile.addView(preview, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
                      return LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER
                          addView(tile, LinearLayout.LayoutParams(dp(58), dp(58)))
                          addView(TextView(this@MainActivity).apply {
                              text = folderName; textSize = 11f; gravity = Gravity.CENTER
                              setTextColor(if (theme == 1 || theme == 5) Color.WHITE else Color.WHITE)
                              maxLines = 1
                          })
                      }
                  }
                  val id = item.ref.toInt()
                  val info = awm.getAppWidgetInfo(id) ?: return null
                  val hv = host.createView(this, id, info)
                  val dm = resources.displayMetrics
                  val wDp = (dm.widthPixels / C * item.w / dm.density).toInt()
                  val hDp = (dm.heightPixels * 0.62f / R * item.h / dm.density).toInt()
                  hv.updateAppWidgetSize(Bundle(), wDp, hDp, wDp, hDp)
                  hv.setOnLongClickListener { itemMenu(item); true }
                  return hv
              }

              private fun buildPage(pos: Int): View {
                  val cl = CellLayout(this, C, R)
                  cl.isClickable = true
                  cl.isLongClickable = true
                  cl.setOnTouchListener { _, e ->
                      if (e.action == MotionEvent.ACTION_DOWN) { cl.lastX = e.x; cl.lastY = e.y }
                      false
                  }
                  cl.setOnLongClickListener { homeMenu(); true }
                  cl.setOnClickListener {
                      if (resizing != null) {
                          resizing = null; refreshHome()
                      } else {
                          val m = moving
                          if (m != null) moveTo(m, pos, cl.cellX(cl.lastX), cl.cellY(cl.lastY))
                      }
                  }
                  val views = java.util.IdentityHashMap<Item, View>()
                  for (item in items.filter { it.page == pos }) {
                      makeView(item)?.let {
                          views[item] = it
                          cl.addView(it, CellLayout.LP(item.x, item.y, item.w, item.h))
                      }
                  }
                  val rz = resizing
                  if (rz != null && rz.page == pos) {
                      val wv = views[rz]
                      val ovLp = CellLayout.LP(rz.x, rz.y, rz.w, rz.h)
                      var bw = rz.w
                      var bh = rz.h
                      var bx = rz.x
                      var by = rz.y
                      val ov = ResizeOverlay(this, rz.type == "widget") { dx, dy, rw, rh, mv, done ->
                          val cw = maxOf(1, cl.width / C)
                          val ch = maxOf(1, cl.height / R)
                          if (mv) {
                              val nx = (bx + Math.round(dx / cw)).coerceIn(0, C - rz.w)
                              val ny = (by + Math.round(dy / ch)).coerceIn(0, R - rz.h)
                              if ((nx != rz.x || ny != rz.y) && isFree(rz.page, nx, ny, rz.w, rz.h, rz)) {
                                  rz.x = nx; rz.y = ny
                                  ovLp.x = nx; ovLp.y = ny
                                  (wv?.layoutParams as? CellLayout.LP)?.let { lp -> lp.x = nx; lp.y = ny }
                                  cl.requestLayout()
                              }
                          } else {
                              val nw = if (rw) (bw + Math.round(dx / cw)).coerceIn(1, C - rz.x) else bw
                              val nh = if (rh) (bh + Math.round(dy / ch)).coerceIn(1, R - rz.y) else bh
                              if ((nw != rz.w || nh != rz.h) && isFree(rz.page, rz.x, rz.y, nw, nh, rz)) {
                                  rz.w = nw; rz.h = nh
                                  ovLp.w = nw; ovLp.h = nh
                                  (wv?.layoutParams as? CellLayout.LP)?.let { lp -> lp.w = nw; lp.h = nh }
                                  cl.requestLayout()
                              }
                          }
                          if (done) {
                              bw = rz.w; bh = rz.h; bx = rz.x; by = rz.y
                              saveItems(); refreshHome()
                          }
                      }
                      cl.addView(ov, ovLp)
                  }
                  return cl
              }

              inner class PagesAdapter : PagerAdapter() {
                  override fun getCount() = pageCount
                  override fun isViewFromObject(v: View, obj: Any) = v === obj
                  override fun instantiateItem(container: ViewGroup, position: Int): Any {
                      val v = buildPage(position)
                      container.addView(v)
                      return v
                  }
                  override fun destroyItem(container: ViewGroup, position: Int, obj: Any) {
                      container.removeView(obj as View)
                  }
                  override fun getItemPosition(obj: Any) = POSITION_NONE
              }

              private fun moveTo(item: Item, page: Int, cx: Int, cy: Int) {
                  val x = minOf(cx, C - item.w)
                  val y = minOf(cy, R - item.h)
                  if (isFree(page, x, y, item.w, item.h, item)) {
                      item.page = page; item.x = x; item.y = y
                      moving = null
                      saveItems(); refreshHome()
                  } else toast("Место занято, выберите другое")
              }

              private fun itemMenu(item: Item) {
                  val widget = item.type == "widget"
                  val opts = arrayOf(
                      if (widget) "Двигать пальцем / менять размер" else "Двигать пальцем",
                      "На другую страницу",
                      if (widget) "Удалить" else "Убрать с рабочего стола"
                  )
                  AlertDialog.Builder(this).setItems(opts) { _, i ->
                      when (i) {
                          0 -> {
                              resizing = item; refreshHome()
                              toast(if (widget) "Тяните за середину, чтобы двигать, за точки — менять размер. Нажмите вне рамки, чтобы закончить"
                                    else "Тяните иконку пальцем. Нажмите вне рамки, чтобы закончить")
                          }
                          1 -> { moving = item; toast("Нажмите на свободное место (можно на другой странице)") }
                          else -> {
                              if (widget) host.deleteAppWidgetId(item.ref.toInt())
                              items.remove(item); saveItems(); refreshHome()
                          }
                      }
                  }.show()
              }

              private fun resizeDialog(item: Item) {
                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(20), dp(10), dp(20), 0) }
                  val ws = (1..C).toList()
                  val hs = (1..R).toList()
                  val sw = Spinner(this).apply {
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, ws.map { "Ширина: $it" })
                      setSelection(item.w - 1)
                  }
                  val sh = Spinner(this).apply {
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, hs.map { "Высота: $it" })
                      setSelection(item.h - 1)
                  }
                  box.addView(sw); box.addView(sh)
                  AlertDialog.Builder(this).setTitle("Размер виджета (в ячейках)").setView(box)
                      .setPositiveButton("Применить") { _, _ ->
                          val nw = ws[sw.selectedItemPosition]
                          val nh = hs[sh.selectedItemPosition]
                          val nx = minOf(item.x, C - nw)
                          val ny = minOf(item.y, R - nh)
                          if (isFree(item.page, nx, ny, nw, nh, item)) {
                              item.w = nw; item.h = nh; item.x = nx; item.y = ny
                              saveItems(); refreshHome()
                          } else toast("Не помещается, место занято")
                      }
                      .setNegativeButton("Отмена", null).show()
              }

              private fun homeMenu() {
                  editBar.visibility = View.VISIBLE
              }

              private fun pagesDialog() {
                  AlertDialog.Builder(this).setItems(arrayOf("Добавить страницу", "Удалить эту страницу")) { _, i ->
                      if (i == 0) {
                          pageCount++
                          prefs.edit().putInt("pages", pageCount).apply()
                          refreshHome()
                          pager.currentItem = pageCount - 1
                      } else removePage(pager.currentItem)
                  }.show()
              }

              private fun removePage(p: Int) {
                  if (pageCount <= 1) { toast("Нельзя удалить единственную страницу"); return }
                  for (i in items.filter { it.page == p && it.type == "widget" }) host.deleteAppWidgetId(i.ref.toInt())
                  items.removeAll { it.page == p }
                  items.filter { it.page > p }.forEach { it.page-- }
                  pageCount--
                  prefs.edit().putInt("pages", pageCount).apply()
                  saveItems(); refreshHome()
              }

              // ================= виджеты =================

              private fun pickWidget() {
                  val provs = awm.installedProviders.sortedBy { it.loadLabel(packageManager).lowercase() }
                  val names = provs.map { it.loadLabel(packageManager) }.toTypedArray()
                  AlertDialog.Builder(this).setTitle("Выберите виджет").setItems(names) { _, i ->
                      val pr = provs[i]
                      val id = host.allocateAppWidgetId()
                      pendingId = id
                      if (awm.bindAppWidgetIdIfAllowed(id, pr.provider)) {
                          afterBind(id)
                      } else {
                          val bind = Intent(AppWidgetManager.ACTION_APPWIDGET_BIND)
                              .putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, id)
                              .putExtra(AppWidgetManager.EXTRA_APPWIDGET_PROVIDER, pr.provider)
                          startActivityForResult(bind, 88)
                      }
                  }.setNegativeButton("Отмена", null).show()
              }

              private fun afterBind(id: Int) {
                  val cfg = awm.getAppWidgetInfo(id)?.configure
                  if (cfg != null) {
                      try {
                          val c = Intent(AppWidgetManager.ACTION_APPWIDGET_CONFIGURE)
                              .setComponent(cfg).putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, id)
                          startActivityForResult(c, 89)
                      } catch (e: Throwable) { addWidget(id) }
                  } else addWidget(id)
              }

              private fun addWidget(id: Int) {
                  val info = awm.getAppWidgetInfo(id)
                  if (info == null) { host.deleteAppWidgetId(id); return }
                  val dm = resources.displayMetrics
                  val cellW = dm.widthPixels / C
                  val cellH = (dm.heightPixels * 0.62f / R).toInt()
                  val w = ceil(info.minWidth.toFloat() / cellW).toInt().coerceIn(1, C)
                  val h = ceil(info.minHeight.toFloat() / cellH).toInt().coerceIn(1, R)
                  if (placeNew("widget", id.toString(), w, h)) {
                      refreshHome()
                      pager.currentItem = items.last().page
                  } else host.deleteAppWidgetId(id)
              }

              // ================= док и меню приложений =================

              private fun buildDock() {
                  dock.removeAllViews()
                  val size = dp(prefs.getInt("icon", 56))
                  for (p in dockList()) {
                      val a = all.firstOrNull { it.pkg == p } ?: continue
                      val cell = FrameLayout(this).apply {
                          layoutParams = LinearLayout.LayoutParams(0, size, 1f)
                          setOnClickListener { launch(a.pkg) }
                          setOnLongClickListener { appMenu(a); true }
                      }
                      cell.addView(iconImage(a, size).apply {
                          layoutParams = FrameLayout.LayoutParams(size, size, Gravity.CENTER)
                      })
                      dock.addView(cell)
                  }
                  dock.addView(TextView(this).apply {
                      text = "▦"; textSize = 28f; setTextColor(Color.WHITE); gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(0, size, 1f)
                      setOnClickListener { openDrawer() }
                  })
              }

              private fun openFolder(item: Item) {
                  val parts = item.ref.split("|", limit = 2)
                  val apps = parts.getOrNull(1).orEmpty().split(";").mapNotNull { pkg -> all.firstOrNull { it.pkg == pkg } }
                  val names = apps.map { it.label }.toTypedArray()
                  if (apps.isEmpty()) { toast("Папка пуста"); return }
                  AlertDialog.Builder(this).setTitle("Папка")
                      .setItems(names) { _, which -> launch(apps[which].pkg) }
                      .setPositiveButton("Изменить") { _, _ -> editFolder(item) }
                      .setNegativeButton("Закрыть", null).show()
              }

              private fun editFolder(item: Item) {
                  val parts = item.ref.split("|", limit = 2)
                  val currentName = parts.firstOrNull()?.takeIf { it.isNotBlank() } ?: "Папка"
                  val current = parts.getOrNull(1).orEmpty().split(";").filter { it.isNotBlank() }.toMutableSet()
                  val labels = all.map { it.label }.toTypedArray()
                  val selected = all.map { it.pkg in current }.toBooleanArray()
                  val input = EditText(this).apply { setText(currentName); hint = "Название папки" }
                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(20), dp(8), dp(20), 0) }
                  box.addView(input)
                  val list = ListView(this)
                  list.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_multiple_choice, labels)
                  list.choiceMode = ListView.CHOICE_MODE_MULTIPLE
                  selected.forEachIndexed { i, yes -> list.setItemChecked(i, yes) }
                  box.addView(list, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(260)))
                  AlertDialog.Builder(this).setTitle("Редактор папки").setView(box)
                      .setPositiveButton("Сохранить") { _, _ ->
                          val chosen = all.filterIndexed { i, _ -> list.isItemChecked(i) }.map { it.pkg }
                          if (chosen.isEmpty()) { items.remove(item) } else item.ref = "${input.text.toString().ifBlank { "Папка" }}|${chosen.joinToString(";")}"
                          saveItems(); refreshHome()
                      }.setNegativeButton("Отмена", null).show()
              }

              private fun createFolder(a: App) {
                  val selected = all.map { it.pkg == a.pkg }.toBooleanArray()
                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(20), dp(8), dp(20), 0) }
                  val name = EditText(this).apply { setText("Папка"); hint = "Название папки" }
                  val list = ListView(this)
                  list.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_multiple_choice, all.map { it.label })
                  list.choiceMode = ListView.CHOICE_MODE_MULTIPLE
                  selected.forEachIndexed { i, yes -> list.setItemChecked(i, yes) }
                  box.addView(name)
                  box.addView(list, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(280)))
                  AlertDialog.Builder(this).setTitle("Новая папка").setView(box)
                      .setPositiveButton("Создать") { _, _ ->
                          val chosen = all.filterIndexed { i, _ -> list.isItemChecked(i) }.map { it.pkg }
                          if (chosen.isNotEmpty() && placeNew("folder", "${name.text.toString().ifBlank { "Папка" }}|${chosen.joinToString(";")}", 1, 1)) {
                              saveItems(); refreshHome(); toast("Папка создана")
                          }
                      }.setNegativeButton("Отмена", null).show()
              }

              private fun appMenu(a: App) {
                  val dockL = dockList()
                  val inDock = a.pkg in dockL
                  val opts = arrayOf("На рабочий стол", if (inDock) "Убрать из дока" else "В док", "Создать папку", "Скрыть", "О приложении", "Удалить")
                  AlertDialog.Builder(this).setTitle(a.label).setItems(opts) { _, i ->
                      when (i) {
                          0 -> { if (placeNew("app", a.pkg, 1, 1)) { refreshHome(); closeDrawer(); toast("Добавлено") } }
                          1 -> if (inDock) saveDock(dockL - a.pkg)
                               else if (dockL.size >= 4) toast("В доке максимум 4")
                               else saveDock(dockL + a.pkg)
                          2 -> createFolder(a)
                          3 -> prefs.edit().putStringSet("hidden", prefs.getStringSet("hidden", emptySet())!!.toMutableSet().apply { add(a.pkg) }).apply()
                          4 -> startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:${a.pkg}")))
                          5 -> startActivity(Intent(Intent.ACTION_DELETE, Uri.parse("package:${a.pkg}")))
                      }
                      buildDock(); applyFilter()
                  }.show()
              }

              private fun openDrawer() { search.setText(""); drawer.visibility = View.VISIBLE; windowBlur(true) }
              private fun closeDrawer() { drawer.visibility = View.GONE; windowBlur(false) }

              // ================= стекло =================

              private fun glassFile() = File(filesDir, "glass.jpg")

              private fun saveJpeg(bmp: Bitmap, name: String) {
                  try { File(filesDir, name).outputStream().use { bmp.compress(Bitmap.CompressFormat.JPEG, 92, it) } } catch (e: Throwable) { }
              }

              private fun startLock(on: Boolean) {
                  val i = Intent(this, LockService::class.java)
                  try { if (on) startForegroundService(i) else stopService(i) } catch (e: Throwable) { }
              }

              private fun loadGlass() {
                  glassBmp = try {
                      if (glassFile().exists()) BitmapFactory.decodeFile(glassFile().path) else null
                  } catch (e: Throwable) { null }
              }

              private fun saveGlass(src: Bitmap, name: String = "glass.jpg") {
                  try {
                      var cur = src
                      val w = src.width
                      val h = src.height
                      while (cur.width > w / 24) {
                          cur = Bitmap.createScaledBitmap(cur, maxOf(1, cur.width / 2), maxOf(1, cur.height / 2), true)
                      }
                      while (cur.width < w) {
                          cur = Bitmap.createScaledBitmap(cur, minOf(w, cur.width * 2), minOf(h, cur.height * 2), true)
                      }
                      File(filesDir, name).outputStream().use { cur.compress(Bitmap.CompressFormat.JPEG, 90, it) }
                  } catch (e: Throwable) { }
              }

              private fun applyGlass() {
                  val a = prefs.getInt("glass", 45)
                  val tint = Color.argb(a, 255, 255, 255)
                  dock.background = GlassDrawable(dock, dp(28).toFloat(), glassBmp, tint)
                  search.background = GlassDrawable(search, dp(24).toFloat(), glassBmp, tint)
                  val theme = prefs.getInt("theme", 1)
                  val drawerTint = when (theme) {
                      1, 9 -> Color.argb(155, 238, 242, 250)
                      2 -> Color.argb(205, 22, 24, 30)
                      3 -> Color.argb(235, 0, 0, 0)
                      7 -> Color.argb(215, 17, 25, 38)
                      8 -> Color.argb(215, 28, 20, 38)
                      else -> Color.argb(190, 12, 14, 20)
                  }
                  drawer.background = if (glassBmp != null)
                      GlassDrawable(drawer, 0f, glassBmp, drawerTint)
                  else ColorDrawable(drawerTint)
                  search.setTextColor(if (theme == 1 || theme == 9) Color.DKGRAY else Color.WHITE)
                  search.setHintTextColor(if (theme == 1 || theme == 9) Color.GRAY else Color.LTGRAY)
              }

              private fun windowBlur(on: Boolean) {
                  if (Build.VERSION.SDK_INT >= 31) {
                      try { window.setBackgroundBlurRadius(if (on && prefs.getBoolean("wblur", true)) dp(24) else 0) } catch (e: Throwable) { }
                  }
              }

