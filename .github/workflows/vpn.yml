name: Build VPN APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "VpnClient"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          android.useAndroidX=true
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.vpnclient"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.vpnclient"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("com.wireguard.android:tunnel:1.0.20230706")
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:label="Мой VPN"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/java/com/example/vpnclient
          cat > app/src/main/java/com/example/vpnclient/MainActivity.kt <<'EOF_FILE'
          package com.example.vpnclient

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.net.VpnService
          import android.os.Build
          import android.os.Bundle
          import android.provider.OpenableColumns
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*
          import com.wireguard.android.backend.GoBackend
          import com.wireguard.android.backend.Tunnel
          import com.wireguard.config.Config
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayInputStream
          import kotlin.concurrent.thread

          /** Туннель WireGuard с именем сервера. */
          class WgTunnel(private val n: String) : Tunnel {
              override fun getName(): String = n
              override fun onStateChange(newState: Tunnel.State) {}
          }

          class MainActivity : Activity() {

              data class Server(val name: String, val conf: String)

              private lateinit var prefs: SharedPreferences
              private lateinit var backend: GoBackend
              private lateinit var status: TextView
              private lateinit var power: TextView
              private lateinit var list: LinearLayout

              private val servers = mutableListOf<Server>()
              private var selected = 0
              private var tunnel: WgTunnel? = null
              private var connectedIndex = -1
              private var busy = false

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_LONG).show()

              // ---------- данные ----------

              private fun load() {
                  servers.clear()
                  val arr = JSONArray(prefs.getString("servers", "[]"))
                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      servers.add(Server(o.getString("n"), o.getString("c")))
                  }
                  selected = prefs.getInt("sel", 0).coerceIn(0, maxOf(0, servers.size - 1))
              }

              private fun save() {
                  val arr = JSONArray()
                  servers.forEach { arr.put(JSONObject().put("n", it.name).put("c", it.conf)) }
                  prefs.edit().putString("servers", arr.toString()).putInt("sel", selected).apply()
              }

              private fun endpointOf(conf: String): String =
                  conf.lines().map { it.trim() }
                      .firstOrNull { it.startsWith("Endpoint", ignoreCase = true) }
                      ?.substringAfter("=")?.trim() ?: "—"

              // ---------- подключение ----------

              private fun setStatus(t: String) = runOnUiThread { status.text = t }

              private fun connect() {
                  if (busy) return
                  val s = servers.getOrNull(selected)
                  if (s == null) { toast("Сначала добавьте сервер"); return }
                  val prep = VpnService.prepare(this)
                  if (prep != null) { startActivityForResult(prep, 1); return }
                  busy = true
                  setStatus("Подключение к «${s.name}»…")
                  thread {
                      try {
                          val cfg = Config.parse(ByteArrayInputStream(s.conf.toByteArray()))
                          tunnel?.let { try { backend.setState(it, Tunnel.State.DOWN, null) } catch (e: Throwable) { } }
                          val t = WgTunnel(s.name)
                          backend.setState(t, Tunnel.State.UP, cfg)
                          tunnel = t
                          connectedIndex = selected
                          setStatus("Подключено: ${s.name}")
                      } catch (e: Throwable) {
                          tunnel = null
                          connectedIndex = -1
                          setStatus("Ошибка: ${e.message ?: e.javaClass.simpleName}")
                      }
                      busy = false
                      runOnUiThread { render() }
                  }
              }

              private fun disconnect() {
                  if (busy) return
                  val t = tunnel ?: return
                  busy = true
                  thread {
                      try { backend.setState(t, Tunnel.State.DOWN, null) } catch (e: Throwable) { }
                      tunnel = null
                      connectedIndex = -1
                      setStatus("Отключено")
                      busy = false
                      runOnUiThread { render() }
                  }
              }

              // ---------- интерфейс ----------

              private fun card(selectedRow: Boolean) = GradientDrawable().apply {
                  cornerRadius = dp(16).toFloat()
                  setColor(Color.argb(if (selectedRow) 60 else 28, 255, 255, 255))
                  setStroke(dp(if (selectedRow) 2 else 1), if (selectedRow) Color.parseColor("#4C8DFF") else Color.argb(50, 255, 255, 255))
              }

              private fun render() {
                  val on = tunnel != null
                  power.background = GradientDrawable().apply {
                      shape = GradientDrawable.OVAL
                      setColor(if (on) Color.parseColor("#1FBF6B") else Color.argb(40, 255, 255, 255))
                      setStroke(dp(3), if (on) Color.parseColor("#7CF0B0") else Color.argb(120, 255, 255, 255))
                  }
                  list.removeAllViews()
                  if (servers.isEmpty()) {
                      list.addView(TextView(this).apply {
                          text = "Серверов пока нет.\nНажмите «+ Сервер» и вставьте конфиг WireGuard\nили импортируйте файл .conf"
                          setTextColor(Color.argb(190, 255, 255, 255)); textSize = 14f
                          setPadding(dp(8), dp(16), dp(8), dp(16))
                      })
                  }
                  servers.forEachIndexed { i, s ->
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(dp(16), dp(12), dp(16), dp(12))
                          background = card(i == selected)
                          layoutParams = LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                          ).apply { bottomMargin = dp(10) }
                          setOnClickListener {
                              if (busy) return@setOnClickListener
                              selected = i; save()
                              if (tunnel != null) connect() else render()
                          }
                          setOnLongClickListener { serverMenu(i); true }
                      }
                      row.addView(TextView(this).apply {
                          text = (if (i == connectedIndex) "● " else "") + s.name
                          setTextColor(if (i == connectedIndex) Color.parseColor("#7CF0B0") else Color.WHITE)
                          textSize = 17f
                      })
                      row.addView(TextView(this).apply {
                          text = endpointOf(s.conf)
                          setTextColor(Color.argb(150, 255, 255, 255)); textSize = 12f
                      })
                      list.addView(row)
                  }
              }

              private fun serverMenu(i: Int) {
                  AlertDialog.Builder(this).setTitle(servers[i].name)
                      .setItems(arrayOf("Изменить", "Удалить")) { _, w ->
                          if (w == 0) editDialog(i)
                          else {
                              if (connectedIndex == i) disconnect()
                              servers.removeAt(i)
                              selected = selected.coerceIn(0, maxOf(0, servers.size - 1))
                              save(); render()
                          }
                      }.show()
              }

              private fun editDialog(index: Int) {
                  val old = servers.getOrNull(index)
                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(20), dp(10), dp(20), 0) }
                  val name = EditText(this).apply { hint = "Название (например, Германия)"; setText(old?.name ?: "") }
                  val conf = EditText(this).apply {
                      hint = "[Interface]\nPrivateKey = …\nAddress = …\n\n[Peer]\nPublicKey = …\nEndpoint = host:51820\nAllowedIPs = 0.0.0.0/0"
                      typeface = Typeface.MONOSPACE; textSize = 12f
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_MULTI_LINE or InputType.TYPE_TEXT_FLAG_NO_SUGGESTIONS
                      minLines = 8; gravity = Gravity.TOP
                      setText(old?.conf ?: "")
                  }
                  box.addView(name); box.addView(conf)
                  AlertDialog.Builder(this).setTitle(if (old == null) "Новый сервер" else "Изменить сервер")
                      .setView(ScrollView(this).apply { addView(box) })
                      .setPositiveButton("Сохранить") { _, _ ->
                          val n = name.text.toString().trim().ifEmpty { "Сервер ${servers.size + 1}" }
                          val c = conf.text.toString().trim()
                          try {
                              Config.parse(ByteArrayInputStream(c.toByteArray()))
                              if (old == null) servers.add(Server(n, c)) else servers[index] = Server(n, c)
                              save(); render()
                          } catch (e: Throwable) {
                              toast("Конфиг не подошёл: ${e.message}")
                          }
                      }
                      .setNegativeButton("Отмена", null).show()
              }

              private fun importFile() {
                  val i = Intent(Intent.ACTION_GET_CONTENT).setType("*/*")
                  startActivityForResult(Intent.createChooser(i, "Файл .conf"), 2)
              }

              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (req == 1 && res == RESULT_OK) { connect(); return }
                  if (req == 2 && res == RESULT_OK) {
                      val uri: Uri = data?.data ?: return
                      try {
                          val text = contentResolver.openInputStream(uri)!!.bufferedReader().use { it.readText() }.trim()
                          var fname = "Сервер ${servers.size + 1}"
                          contentResolver.query(uri, null, null, null, null)?.use { c ->
                              val idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                              if (idx >= 0 && c.moveToFirst()) fname = c.getString(idx).substringBeforeLast(".")
                          }
                          Config.parse(ByteArrayInputStream(text.toByteArray()))
                          servers.add(Server(fname, text))
                          save(); render()
                          toast("Добавлен: $fname")
                      } catch (e: Throwable) {
                          toast("Файл не подошёл: ${e.message}")
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = getSharedPreferences("vpn", MODE_PRIVATE)
                  backend = GoBackend(applicationContext)
                  load()
                  if (Build.VERSION.SDK_INT >= 33) requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 5)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(44), dp(20), dp(16))
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TOP_BOTTOM,
                          intArrayOf(Color.parseColor("#0F1220"), Color.parseColor("#1B2140"))
                      )
                  }
                  root.addView(TextView(this).apply {
                      text = "Мой VPN"; textSize = 26f; setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD
                  })
                  status = TextView(this).apply {
                      text = "Отключено"; textSize = 14f; setTextColor(Color.argb(190, 255, 255, 255))
                      setPadding(0, dp(4), 0, dp(12))
                  }
                  root.addView(status)

                  power = TextView(this).apply {
                      text = "⏻"; textSize = 54f; setTextColor(Color.WHITE); gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(dp(140), dp(140)).apply {
                          gravity = Gravity.CENTER_HORIZONTAL; topMargin = dp(8); bottomMargin = dp(20)
                      }
                      setOnClickListener { if (tunnel != null) disconnect() else connect() }
                  }
                  root.addView(power)

                  val bar = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                  bar.addView(TextView(this).apply {
                      text = "Серверы"; textSize = 18f; setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  })
                  bar.addView(Button(this).apply { text = "+ Сервер"; setOnClickListener { editDialog(-1) } })
                  bar.addView(Button(this).apply { text = "Файл"; setOnClickListener { importFile() } })
                  root.addView(bar)

                  list = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  root.addView(ScrollView(this).apply {
                      addView(list)
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f)
                  })
                  root.addView(TextView(this).apply {
                      text = "Нажмите на сервер — выбрать. Долгое нажатие — изменить или удалить."
                      textSize = 11f; setTextColor(Color.argb(130, 255, 255, 255)); gravity = Gravity.CENTER
                      setPadding(0, dp(8), 0, 0)
                  })
                  setContentView(root)
                  render()
              }
          }
          EOF_FILE
      - name: Build
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VPN-apk
          path: app/build/outputs/apk/debug/app-debug.apk
