name: Build Fortnite Boost APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "FortniteBoost"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          android.useAndroidX=true
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.fnboost"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.fnboost"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <package android:name="com.epicgames.fortnite" />
              </queries>
              <application
                  android:label="Fortnite Boost"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|density|uiMode|keyboard|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:enabled="true"
                      android:exported="true"
                      android:multiprocess="false"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/java/com/example/fnboost
          cat > app/src/main/java/com/example/fnboost/MainActivity.kt <<'EOF_FILE'
          package com.example.fnboost

          import android.app.Activity
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*
          import rikka.shizuku.Shizuku
          import kotlin.concurrent.thread

          class MainActivity : Activity() {

              private val PKG = "com.epicgames.fortnite"
              private lateinit var prefs: SharedPreferences
              private lateinit var status: TextView

              private val resOpts = listOf(100, 90, 80, 70, 60)
              private val hzOpts = listOf(0, 60, 90, 120, 144)

              private val permListener = Shizuku.OnRequestPermissionResultListener { _, _ ->
                  runOnUiThread { refreshStatus() }
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_LONG).show()

              private fun shizukuOk() = try {
                  Shizuku.pingBinder() && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
              } catch (e: Throwable) { false }

              private fun sh(cmd: String): String {
                  val m = Shizuku::class.java.getDeclaredMethod(
                      "newProcess", Array<String>::class.java, Array<String>::class.java, String::class.java
                  )
                  m.isAccessible = true
                  val p = m.invoke(null, arrayOf("sh", "-c", cmd), null, null) as Process
                  val out = p.inputStream.bufferedReader().readText() + p.errorStream.bufferedReader().readText()
                  p.waitFor()
                  return out.trim()
              }

              private fun refreshStatus() {
                  val inst = packageManager.getLaunchIntentForPackage(PKG) != null
                  status.text = "Shizuku: " + (if (shizukuOk()) "доступ есть ✓" else "нет доступа ✗") +
                      "\nFortnite: " + (if (inst) "установлен ✓" else "не найден ✗")
              }

              private fun requestAccess() {
                  try {
                      if (!Shizuku.pingBinder()) toast("Shizuku не запущен. Откройте Shizuku и нажмите Start")
                      else Shizuku.requestPermission(0)
                  } catch (e: Throwable) { toast("Shizuku не установлен") }
              }

              private fun resetCommands(): String =
                  "settings delete system min_refresh_rate; settings delete system peak_refresh_rate; " +
                      "wm size reset; wm density reset; cmd game mode standard $PKG"

              private fun reset() {
                  if (!shizukuOk()) { toast("Нет доступа Shizuku"); return }
                  thread {
                      try { sh(resetCommands()) } catch (e: Throwable) { }
                      prefs.edit().putLong("boosted_at", 0L).apply()
                      runOnUiThread { toast("Экран и режимы возвращены") }
                  }
              }

              private fun boostAndLaunch(res: Int, hz: Int, gameMode: Boolean, kill: Boolean) {
                  val intent = packageManager.getLaunchIntentForPackage(PKG)
                  if (intent == null) {
                      toast("Fortnite не установлен")
                      try { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=$PKG"))) } catch (e: Throwable) { }
                      return
                  }
                  if (!shizukuOk()) { toast("Сначала нажмите «Доступ Shizuku»"); return }
                  val cmds = mutableListOf<String>()
                  if (res < 100) {
                      cmds += "S=\$(wm size | grep Physical | sed 's/.*: //'); W=\${S%x*}; H=\${S#*x}; wm size \$((W*$res/100))x\$((H*$res/100))"
                  }
                  if (hz > 0) cmds += "settings put system min_refresh_rate $hz; settings put system peak_refresh_rate $hz"
                  if (gameMode) cmds += "cmd game mode performance $PKG"
                  if (kill) cmds += "am kill-all"
                  thread {
                      try { if (cmds.isNotEmpty()) sh(cmds.joinToString("; ")) } catch (e: Throwable) { }
                      prefs.edit().putLong("boosted_at", System.currentTimeMillis()).apply()
                      Thread.sleep(500)
                      runOnUiThread { startActivity(intent) }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = getSharedPreferences("fn", MODE_PRIVATE)
                  try { Shizuku.addRequestPermissionResultListener(permListener) } catch (e: Throwable) { }

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(44), dp(20), dp(16))
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TOP_BOTTOM,
                          intArrayOf(Color.parseColor("#0E1224"), Color.parseColor("#1F2A52"))
                      )
                  }
                  root.addView(TextView(this).apply {
                      text = "Fortnite Boost"; textSize = 26f; setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD
                  })
                  status = TextView(this).apply {
                      textSize = 14f; setTextColor(Color.argb(210, 255, 255, 255)); setPadding(0, dp(6), 0, dp(10))
                  }
                  root.addView(status)
                  root.addView(Button(this).apply { text = "Доступ Shizuku"; setOnClickListener { requestAccess() } })

                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(12), dp(16), dp(14))
                      background = GradientDrawable().apply {
                          cornerRadius = dp(18).toFloat()
                          setColor(Color.argb(30, 255, 255, 255))
                          setStroke(dp(1), Color.argb(60, 255, 255, 255))
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = dp(12) }
                  }
                  fun label(t: String) = TextView(this).apply {
                      text = t; setTextColor(Color.WHITE); setPadding(0, dp(10), 0, dp(2))
                  }
                  val resSp = Spinner(this).apply {
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, resOpts.map { "$it%" })
                      setSelection(resOpts.indexOf(prefs.getInt("res", 80)).coerceAtLeast(0))
                  }
                  val hzSp = Spinner(this).apply {
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item,
                          hzOpts.map { if (it == 0) "Авто" else "$it Гц" })
                      setSelection(hzOpts.indexOf(prefs.getInt("hz", 60)).coerceAtLeast(0))
                  }
                  val gm = CheckBox(this).apply { text = "Режим производительности (Android 12+)"; setTextColor(Color.WHITE); isChecked = prefs.getBoolean("gm", true) }
                  val kill = CheckBox(this).apply { text = "Очистить фоновые приложения"; setTextColor(Color.WHITE); isChecked = prefs.getBoolean("kill", true) }
                  card.addView(label("Разрешение экрана (меньше — выше FPS)")); card.addView(resSp)
                  card.addView(label("Частота экрана")); card.addView(hzSp)
                  card.addView(gm); card.addView(kill)
                  root.addView(card)

                  root.addView(Button(this).apply {
                      text = "▶  Запустить Fortnite с бустом"; textSize = 16f
                      setOnClickListener {
                          val r = resOpts[resSp.selectedItemPosition]
                          val h = hzOpts[hzSp.selectedItemPosition]
                          prefs.edit().putInt("res", r).putInt("hz", h).putBoolean("gm", gm.isChecked).putBoolean("kill", kill.isChecked).apply()
                          boostAndLaunch(r, h, gm.isChecked, kill.isChecked)
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = dp(16) }
                  })
                  root.addView(Button(this).apply { text = "Сбросить экран"; setOnClickListener { reset() } })
                  root.addView(TextView(this).apply {
                      text = "Это не снимает лимит кадров самой игры: максимум FPS в Fortnite зависит от поддержки вашего телефона. " +
                          "Приложение лишь освобождает ресурсы и снижает нагрузку на экран. После игры нажмите «Сбросить экран»."
                      textSize = 12f; setTextColor(Color.argb(150, 255, 255, 255)); setPadding(0, dp(14), 0, 0)
                  })
                  setContentView(root)
                  refreshStatus()
              }

              override fun onResume() {
                  super.onResume()
                  refreshStatus()
                  // вернулись из игры спустя время — возвращаем экран
                  val t = prefs.getLong("boosted_at", 0L)
                  if (t > 0L && System.currentTimeMillis() - t > 20_000L && shizukuOk()) reset()
              }

              override fun onDestroy() {
                  try { Shizuku.removeRequestPermissionResultListener(permListener) } catch (e: Throwable) { }
                  super.onDestroy()
              }
          }
          EOF_FILE
      - name: Build
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FortniteBoost-apk
          path: app/build/outputs/apk/debug/app-debug.apk
