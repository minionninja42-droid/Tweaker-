name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "ScreenTweaker"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          android.useAndroidX=true
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.screentweaker"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.screentweaker"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Screen Tweaker"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:enabled="true"
                      android:exported="true"
                      android:multiprocess="false"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/java/com/example/screentweaker
          cat > app/src/main/java/com/example/screentweaker/MainActivity.kt <<'EOF_FILE'
          package com.example.screentweaker

          import android.app.Activity
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.text.InputType
          import android.util.TypedValue
          import android.widget.*
          import rikka.shizuku.Shizuku
          import kotlin.concurrent.thread

          class MainActivity : Activity() {

              private val cutouts = listOf("corner", "double", "narrow", "wide", "tall", "hole")
              private lateinit var status: TextView

              private val permListener = Shizuku.OnRequestPermissionResultListener { _, _ ->
                  runOnUiThread { toast("Доступ: " + if (hasPerm()) "выдан" else "отказано") }
              }

              private fun hasPerm() = try {
                  Shizuku.pingBinder() && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
              } catch (e: Throwable) { false }

              // Выполнение shell-команды от имени Shizuku (права shell/adb)
              private fun sh(cmd: String): String {
                  val m = Shizuku::class.java.getDeclaredMethod(
                      "newProcess", Array<String>::class.java, Array<String>::class.java, String::class.java
                  )
                  m.isAccessible = true
                  val p = m.invoke(null, arrayOf("sh", "-c", cmd), null, null) as Process
                  val out = p.inputStream.bufferedReader().readText() + p.errorStream.bufferedReader().readText()
                  p.waitFor()
                  return out.trim()
              }

              private fun run(cmd: String) {
                  if (!hasPerm()) { toast("Нет доступа Shizuku. Запустите Shizuku и нажмите «Выдать доступ»"); return }
                  thread {
                      val r = try { sh(cmd) } catch (e: Throwable) { "Ошибка: ${e.message}" }
                      runOnUiThread { status.text = if (r.isEmpty()) "Готово" else r }
                  }
              }

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()

              private fun btn(text: String, onClick: () -> Unit) = Button(this).apply {
                  this.text = text
                  setOnClickListener { onClick() }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Shizuku.addRequestPermissionResultListener(permListener)

                  val pad = TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, 20f, resources.displayMetrics).toInt()
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad * 2, pad, pad)
                  }

                  root.addView(btn("Выдать доступ Shizuku") {
                      try {
                          if (!Shizuku.pingBinder()) toast("Shizuku не запущен")
                          else Shizuku.requestPermission(0)
                      } catch (e: Throwable) { toast("Shizuku не установлен") }
                  })

                  // --- Минимальная ширина ---
                  root.addView(TextView(this).apply { text = "\nМинимальная ширина (dp)"; textSize = 18f })
                  val widthInput = EditText(this).apply {
                      inputType = InputType.TYPE_CLASS_NUMBER
                      hint = "например 360"
                  }
                  root.addView(widthInput)
                  root.addView(btn("Применить ширину") {
                      val dp = widthInput.text.toString().toIntOrNull()
                      if (dp == null || dp < 200) { toast("Введите число от 200"); return@btn }
                      val px = minOf(resources.displayMetrics.widthPixels, resources.displayMetrics.heightPixels)
                      val dpi = 160 * px / dp
                      run("wm density $dpi")
                  })
                  root.addView(btn("Сбросить ширину") { run("wm density reset") })

                  // --- Вырез экрана ---
                  root.addView(TextView(this).apply { text = "\nВырез экрана"; textSize = 18f })
                  val spinner = Spinner(this).apply {
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, cutouts)
                  }
                  root.addView(spinner)
                  root.addView(btn("Применить вырез") {
                      val name = cutouts[spinner.selectedItemPosition]
                      val base = "com.android.internal.display.cutout.emulation"
                      val off = cutouts.joinToString("; ") { "cmd overlay disable $base.$it" }
                      run("$off; cmd overlay enable $base.$name")
                  })
                  root.addView(btn("Убрать вырез") {
                      val base = "com.android.internal.display.cutout.emulation"
                      run(cutouts.joinToString("; ") { "cmd overlay disable $base.$it" })
                  })

                  status = TextView(this).apply { text = "\n"; textSize = 14f }
                  root.addView(status)

                  setContentView(ScrollView(this).apply { addView(root) })
              }

              override fun onDestroy() {
                  Shizuku.removeRequestPermissionResultListener(permListener)
                  super.onDestroy()
              }
          }
          EOF_FILE
      - name: Build
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTweaker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
