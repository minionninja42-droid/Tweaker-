                      setPadding(dp(16), dp(10), dp(16), dp(10))
                      background = GradientDrawable().apply { cornerRadius = dp(24).toFloat(); setColor(Color.argb(90, 255, 255, 255)) }
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      addTextChangedListener(object : TextWatcher {
                          override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                          override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                          override fun afterTextChanged(s: Editable?) { applyFilter() }
                      })
                  }
                  bar.addView(search)
                  bar.addView(TextView(this).apply {
                      text = "⚙"; textSize = 26f; setTextColor(Color.WHITE)
                      setPadding(dp(14), 0, dp(6), 0)
                      setOnClickListener { settingsDialog() }
                  })
                  drawer.addView(bar)

                  adapter = AppAdapter()
                  grid = GridView(this).apply {
                      numColumns = prefs.getInt("cols", 4)
                      adapter = this@MainActivity.adapter
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f)
                      setPadding(dp(8), dp(4), dp(8), dp(4))
                      clipToPadding = false
                      selector = ColorDrawable(Color.TRANSPARENT)
                      setOnItemClickListener { _, _, i, _ -> launch(shown[i].pkg); closeDrawer() }
                      setOnItemLongClickListener { _, _, i, _ -> appMenu(shown[i]); true }
                  }
                  drawer.addView(grid)
                  root.addView(drawer, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))

                  editBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      visibility = View.GONE
                      setPadding(dp(8), dp(12), dp(8), dp(12))
                      background = GradientDrawable().apply {
                          cornerRadius = dp(26).toFloat()
                          setColor(Color.argb(200, 24, 24, 28))
                          setStroke(2, Color.argb(90, 255, 255, 255))
                      }
                  }
                  fun editItem(sym: String, name: String, f: () -> Unit) {
                      val t = TextView(this).apply {
                          text = "$sym\n$name"; textSize = 12f; setTextColor(Color.WHITE); gravity = Gravity.CENTER
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                          setOnClickListener { f() }
                      }
                      editBar.addView(t)
                  }
                  editItem("🖼", "Обои") { wallpaperDialog() }
                  editItem("▤", "Виджеты") { pickWidget() }
                  editItem("⧉", "Страницы") { pagesDialog() }
                  editItem("⚙", "Настройки") { settingsDialog() }
                  editItem("✔", "Готово") { editBar.visibility = View.GONE }
                  root.addView(editBar, FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.BOTTOM
                  ).apply { setMargins(dp(12), 0, dp(12), dp(16)) })

                  setContentView(root)
                  loadGlass()
                  applySettings()
                  if (prefs.getBoolean("lock", false) && Settings.canDrawOverlays(this)) startLock(true)
              }

              override fun onStart() {
                  super.onStart()
                  try { host.startListening() } catch (e: Throwable) { }
              }

              override fun onStop() {
                  try { host.stopListening() } catch (e: Throwable) { }
                  super.onStop()
              }

              override fun onResume() {
                  super.onResume()
                  loadApps()
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  closeDrawer()
                  moving = null
                  if (resizing != null) { resizing = null; refreshHome() }
                  pager.currentItem = 0
              }

              override fun onBackPressed() {
                  when {
                      drawer.visibility == View.VISIBLE -> closeDrawer()
                      editBar.visibility == View.VISIBLE -> editBar.visibility = View.GONE
                      moving != null -> { moving = null; toast("Перемещение отменено") }
                      resizing != null -> { resizing = null; refreshHome() }
                  }
              }
          }
          EOF_FILE
      - name: Build
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HomeLauncher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
