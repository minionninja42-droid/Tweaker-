              private fun decode(uri: Uri): Bitmap {
                  val dm = resources.displayMetrics
                  val tw = dm.widthPixels
                  val th = dm.heightPixels
                  val o = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  contentResolver.openInputStream(uri)!!.use { BitmapFactory.decodeStream(it, null, o) }
                  var s = 1
                  while (o.outWidth / (s * 2) >= tw && o.outHeight / (s * 2) >= th) s *= 2
                  val o2 = BitmapFactory.Options().apply { inSampleSize = s }
                  val src = contentResolver.openInputStream(uri)!!.use { BitmapFactory.decodeStream(it, null, o2) }!!
                  val scale = maxOf(tw.toFloat() / src.width, th.toFloat() / src.height)
                  val nw = maxOf(tw, ceil(src.width * scale).toInt())
                  val nh = maxOf(th, ceil(src.height * scale).toInt())
                  val scaled = Bitmap.createScaledBitmap(src, nw, nh, true)
                  return Bitmap.createBitmap(scaled, (nw - tw) / 2, (nh - th) / 2, tw, th)
              }

              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (req == 88) { if (res == RESULT_OK) afterBind(pendingId) else host.deleteAppWidgetId(pendingId); return }
                  if (req == 89) { if (res == RESULT_OK) addWidget(pendingId) else host.deleteAppWidgetId(pendingId); return }
                  if (req == 77 && res == RESULT_OK) {
                      val uri = data?.data ?: return
                      toast("Устанавливаю обои…")
                      thread {
                          try {
                              val flags = when (wallTarget) {
                                  0 -> WallpaperManager.FLAG_SYSTEM
                                  1 -> WallpaperManager.FLAG_LOCK
                                  else -> WallpaperManager.FLAG_SYSTEM or WallpaperManager.FLAG_LOCK
                              }
                              val bmp = decode(uri)
                              WallpaperManager.getInstance(this).setBitmap(bmp, null, true, flags)
                              if (wallTarget != 1) saveGlass(bmp)
                              if (wallTarget != 0) { saveJpeg(bmp, "lockbg.jpg"); saveGlass(bmp, "lockglass.jpg") }
                              runOnUiThread { loadGlass(); applyGlass(); toast("Обои установлены") }
                          } catch (e: Throwable) {
                              runOnUiThread { toast("Ошибка: ${e.message}") }
                          }
                      }
                  }
              }

